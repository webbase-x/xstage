name: Audit owned Karaoke PC MIDI lyrics engine

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_karaoke_pc_midi.py"
      - ".github/workflows/audit-karaoke-midi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect verified Karaoke PC MIDI and lyric source
        run: python scripts/audit_karaoke_pc_midi.py
