name: X-Stage Song Studio PC public distribution smoke

on:
  push:
    branches: [main]
    paths:
      - "songstudio-pc/**"
      - "downloads/song-studio-latest.json"
      - "downloads/song-studio-source-preview-latest.json"
      - ".github/workflows/test-songstudio-pc-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-consumer-release:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
      - name: Validate public Ready release metadata, without source-only archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-Content 'downloads/song-studio-latest.json' -Raw | ConvertFrom-Json
          $legacy = Get-Content 'downloads/song-studio-source-preview-latest.json' -Raw | ConvertFrom-Json
          if ($meta.channel -ne 'pc-ready' -or $meta.package_type -ne 'portable_zip' -or $meta.available -ne $true) {
            throw 'Consumer release metadata must identify a published PC Ready ZIP'
          }
          if ($meta.sha256 -notmatch '^[0-9a-f]{64}$' -or $meta.download_url -notlike 'https://github.com/webbase-x/xstage/releases/download/*.zip') {
            throw 'Release ZIP URL or SHA-256 missing'
          }
          if ($legacy.source_available -ne $false -or $null -ne $legacy.source_archive) {
            throw 'Public source-only preview must be disabled'
          }
          Write-Host "PASS: PC Ready is public; no source-only preview download advertised."
      - name: Compile current PC launcher sources on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m compileall -q songstudio-pc
          if ($LASTEXITCODE -ne 0) { throw 'Song Studio source syntax failure' }
          foreach ($name in @('songstudio-pc/Start-Song-Studio.cmd', 'songstudio-pc/Start-Song-Studio.ps1', 'songstudio-pc/engine.py')) {
            if (-not (Test-Path $name)) { throw "Missing PC source fixture: $name" }
          }
          Write-Host "PASS: current Windows launcher sources parse; published Ready packaging is validated by build-songstudio-pc-ready.yml."
