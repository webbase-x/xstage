name: P5 Chromakey Windows Simulation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows-pc/source/karaoke/chroma_*.py'
      - 'windows-pc/source/karaoke/opencv_frame_source.py'
      - 'windows-pc/source/karaoke/ui.py'
      - 'windows-pc/source/tests/test_chroma*.py'
      - 'windows-pc/source/tests/test_opencv_frame_source.py'
      - 'windows-pc/source/tests/test_p5_stage_virtual_integration.py'
      - '.github/workflows/p5-chroma-windows-simulation.yml'

jobs:
  simulated-video:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: windows-pc/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simulation video decoder and renderer
        run: python -m pip install Pillow opencv-python-headless
      - name: Compile renderer, UI and frame adapters
        run: python -m compileall -q karaoke
      - name: Run chroma-key and simulated decoder tests
        run: |
          python -m unittest discover -s tests -p "test_chroma_key.py" -v
          python -m unittest discover -s tests -p "test_chroma_video_renderer.py" -v
          python -m unittest discover -s tests -p "test_chroma_frame_source.py" -v
          python -m unittest discover -s tests -p "test_opencv_frame_source.py" -v
          python -m unittest discover -s tests -p "test_chroma_real_decoder_integration.py" -v
          python -m unittest discover -s tests -p "test_p5_stage_virtual_integration.py" -v
