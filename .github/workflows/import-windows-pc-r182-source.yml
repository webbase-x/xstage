name: Import X-Stage Windows PC v0.9.48 R18.2 verified updater source

on:
  push:
    paths:
      - 'downloads/X-Stage-Karaoke-v0.9.48-Windows-Source-R18.2-Verified-Updater.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-xstage-windows-pc
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check archive checksum and import verified source
        run: python3 scripts/import_windows_pc_updated_source.py
      - name: Compile Windows Python source syntax
        run: python3 -m compileall -q windows-pc/source/karaoke
      - name: Commit verified source and manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- windows-pc/source windows-pc/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Import X-Stage Windows v0.9.48 R18.2 source with release updater"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Windows source already matches verified archive."
          fi
