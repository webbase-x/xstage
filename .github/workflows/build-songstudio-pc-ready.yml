name: X-Stage Song Studio PC Ready Offline ZIP

on:
  push:
    branches: [main]
    paths:
      - "songstudio-pc/**"
      - "scripts/build_songstudio_ready.ps1"
      - "scripts/test_songstudio_ready.py"
      - "studio/index.html"
      - "studio/app-icon.svg"
      - "studio/site.webmanifest"
      - "scripts/build_songstudio_app_icon.py"
      - "studio/app.js"
      - "studio/style.css"
      - "studio/entry.js"
      - ".github/workflows/build-songstudio-pc-ready.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xstage-songstudio-ready-build306
  cancel-in-progress: false

jobs:
  bundle-windows:
    runs-on: windows-2022
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'songstudio-pc/ai-requirements.txt'
      - name: Prepare app icon renderer (build runner only)
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw "Build-only Pillow package failed" }
      - name: Build complete bundled Windows runtime and ZIP
        shell: powershell
        run: |
          & ./scripts/build_songstudio_ready.ps1
          if ($LASTEXITCODE -ne 0) { throw "READY bundle packaging failed" }
      - name: Verify real audio and MIDI conversions
        shell: powershell
        run: |
          $base = "dist/X-Stage-Song-Studio-PC-Ready-v0.3.6-build306"
          $py = Join-Path $base ".runtime/python/python.exe"
          if (!(Test-Path $py)) { throw "Portable Python not found" }
          & $py scripts/test_songstudio_ready.py $base
          if ($LASTEXITCODE -ne 0) { throw "Ready runtime conversion tests FAILED" }
      - name: Test bundled Windows picker and Thai Unicode return
        shell: powershell
        run: |
          $base = "dist/X-Stage-Song-Studio-PC-Ready-v0.3.6-build306"
          $picker = Join-Path $base "pick_path.ps1"
          if (!(Test-Path $picker)) { throw "Windows picker script was not bundled" }
          $reply = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -STA -File $picker -Kind source -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Picker script self-test failed" }
          if ($reply -notmatch '^PICKER_SELFTEST:([A-Za-z0-9+/=]+)$') { throw "Picker protocol invalid: $reply" }
          $actual = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($Matches[1]))
          $expected = 'C:\' + (-join @([char]0x0E17,[char]0x0E14,[char]0x0E2A,[char]0x0E2D,[char]0x0E1A,[char]0x005C,[char]0x0E40,[char]0x0E1E,[char]0x0E25,[char]0x0E07))
          if ($actual -ne $expected) { throw "Thai Unicode picker path was corrupted" }
          Write-Host "PASS: Windows picker script runs and returns Unicode paths safely."
      - name: Verify ZIP and SHA256 manifest
        shell: powershell
        run: |
          $zip = "dist/X-Stage-Song-Studio-PC-Ready-v0.3.6-build306.zip"
          $hashfile = "$zip.sha256"
          if (!(Test-Path $zip) -or !(Test-Path $hashfile)) { throw "Missing archive or checksum" }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content $hashfile -Raw) -split '\s+')[0]
          if ($actual -ne $expected) { throw "Final ZIP checksum mismatch" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($name in @("studio/app-icon.svg", "studio/app-icon.ico", "studio/app-icon-512.png",
                                "Create-Desktop-Shortcut.cmd", "Create-Desktop-Shortcut.ps1",
                                "Start-Song-Studio.cmd", "pick_path.ps1", "ai_separate.py", "ai-model.lock.json", "live_preview.py",
                                ".runtime/models/htdemucs_fp16weights.onnx",
                                ".runtime/ai-site/numpy/__init__.py", ".runtime/ai-site/onnxruntime/__init__.py",
                                ".engine-ready-manifest.json", "engine.py",
                                ".runtime/python/python.exe", ".runtime/tools/ffmpeg.exe",
                                ".runtime/fluidsynth/bin/fluidsynth.exe", ".runtime/soundfonts/GeneralUser-GS.sf2")) {
              if (!($names | Where-Object { $_.EndsWith($name) })) {
                throw "Final ZIP missing: $name"
              }
            }
          } finally { $archive.Dispose() }
          Write-Host "PASS: Complete offline ZIP SHA-256 $actual"
      - name: Upload verified Ready ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-Stage-Song-Studio-PC-Ready-v0.3.6-build306
          path: |
            dist/X-Stage-Song-Studio-PC-Ready-v0.3.6-build306.zip
            dist/X-Stage-Song-Studio-PC-Ready-v0.3.6-build306.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Publish GitHub release after tests pass
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "song-studio-pc-ready-v0.3.6-build306"
          $zip = "dist/X-Stage-Song-Studio-PC-Ready-v0.3.6-build306.zip"
          $sha = "$zip.sha256"
          $notes = @'
          Windows 10/11 x64 offline portable. Includes Python, FFmpeg, FluidSynth,
          GeneralUser SoundFont, NumPy, ONNX Runtime CPU, and the 166 MB
          verified HTDemucs ONNX model. AI Separation creates local karaoke
          instrumental and vocals files. No installation or model download
          on user's PC. Redesigned X-Stage Song Studio PC app icon included
          as SVG favicon, Windows ICO, and 512px PNG. Optional desktop
          shortcut uses the matching Windows ICO. Live karaoke preview
          streams music with MIDI SoundFont without creating preview files.
          Extract full ZIP and run Start-Song-Studio.cmd.

          Limitations: not the original Build205 engine; NCN conversion and
          private Google Drive sync are not supported in the Source Preview.
          '@
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$zip" "$sha" --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag "$zip" "$sha" --title "X-Stage Song Studio PC Ready v0.3.6 Build 306" --notes $notes --prerelease --latest=false --target "$env:GITHUB_SHA" --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish verified Ready ZIP" }
