name: X-Stage Song Studio PC Ready Offline ZIP

on:
  push:
    branches: [main]
    paths:
      - "songstudio-pc/**"
      - "scripts/build_songstudio_ready.ps1"
      - "scripts/test_songstudio_ready.py"
      - "scripts/song-studio-web-test.mjs"
      - "scripts/test_songstudio_ui_contract.mjs"
      - "scripts/test_songstudio_lyric_source_folder.py"
      - "scripts/test_songstudio_lrc_folder.py"
      - "scripts/song-studio-browser-e2e.mjs"
      - "studio/web.html"
      - "studio/web.js"
      - "studio/web.css"
      - "scripts/test_songstudio_ai_import.py"
      - "scripts/test_songstudio_ai_export.py"
      - "scripts/test_songstudio_ui_contract.mjs"
      - "scripts/test_songstudio_lyric_source_folder.py"
      - "scripts/test_songstudio_lrc_folder.py"
      - "scripts/test_songstudio_drive_roundtrip.py"
      - "scripts/test_songstudio_online_publish.py"
      - "scripts/test_songstudio_folder_upload.py"
      - "scripts/test_songstudio_code_registry.py"
      - "scripts/test_songstudio_lyrics_preview.py"
      - "scripts/test_songstudio_ncn.py"
      - "scripts/test_songstudio_ncn_bulk_editor.py"
      - "scripts/test_songstudio_lyr_skipped_report.py"
      - "scripts/test_songstudio_drive_download.py"
      - "scripts/test_songstudio_pc.py"
      - "scripts/test_songstudio_drive_layout.py"
      - "studio/index.html"
      - "studio/app-icon.svg"
      - "studio/site.webmanifest"
      - "scripts/build_songstudio_app_icon.py"
      - "studio/app.js"
      - "studio/style.css"
      - "studio/entry.js"
      - ".github/workflows/build-songstudio-pc-ready.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xstage-songstudio-ready-build332
  cancel-in-progress: true

jobs:
  bundle-windows:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      # Owner sets Desktop Client ID as Actions Variable and the matching
      # Desktop Client Secret as Actions Secret. Native clients are public;
      # the built ZIP necessarily contains the pair. Never ship user tokens.
      XSTAGE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.XSTAGE_GOOGLE_DESKTOP_CLIENT_ID || vars.XSTAGE_GOOGLE_DESKTOP_CLIENT_ID }}
      XSTAGE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.XSTAGE_GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'songstudio-pc/ai-requirements.txt'
      - name: Prepare app icon renderer (build runner only)
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw "Build-only Pillow package failed" }
      - name: Preflight source syntax and PC/Web UI
        shell: powershell
        run: |
          & python -m compileall -q songstudio-pc scripts
          if ($LASTEXITCODE -ne 0) { throw "Python source compilation failed" }
          $psFiles = @('scripts/build_songstudio_ready.ps1',
                       'songstudio-pc/Start-Song-Studio-Ready.ps1',
                       'songstudio-pc/Start-Song-Studio.ps1')
          foreach ($psFile in $psFiles) {
            $parseTokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $psFile), [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed: $psFile"
            }
          }
          Write-Host "PASS: all Song Studio Windows launcher/build PowerShell scripts parse cleanly"
          & node --check studio/app.js
          if ($LASTEXITCODE -ne 0) { throw "PC/Web Control JavaScript syntax failed" }
          & node --check studio/web.js
          if ($LASTEXITCODE -ne 0) { throw "Web-only JavaScript syntax failed" }
          & node scripts/test_songstudio_ui_contract.mjs
          if ($LASTEXITCODE -ne 0) { throw "PC AI Lyrics/Drive user interface contracts failed" }
          & node scripts/song-studio-web-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Web Studio file/ZIP/privacy smoke failed" }
      - name: Regression tests for deduplication and resume
        shell: powershell
        run: |
          & python -m unittest discover -s scripts -p test_songstudio_pc.py -v
          if ($LASTEXITCODE -ne 0) { throw "Duplicate and resume regression tests failed" }
          & python -m unittest discover -s scripts -p test_songstudio_drive_download.py -v
          if ($LASTEXITCODE -ne 0) { throw "Google Drive download read-only regressions failed" }
          & python -m unittest discover -s scripts -p test_songstudio_build_outcomes.py -v
          if ($LASTEXITCODE -ne 0) { throw "Build outcome status regressions failed" }
          & python -m unittest discover -s scripts -p test_songstudio_ncn.py -v
          if ($LASTEXITCODE -ne 0) { throw "NCN Song/Lyrics/Cursor regressions failed" }
          & python -m unittest discover -s scripts -p test_songstudio_ncn_bulk_editor.py -v
          if ($LASTEXITCODE -ne 0) { throw "NCN native bulk LYR/CUR regression tests failed" }
          & python -m unittest discover -s scripts -p test_songstudio_lyr_skipped_report.py -v
          if ($LASTEXITCODE -ne 0) { throw "Skipped LYR audit, recovery and CSV regression tests failed" }
          & python -m unittest discover -s scripts -p test_songstudio_smart_scan.py -v
          if ($LASTEXITCODE -ne 0) { throw "SQLite Smart Scan regressions failed" }
          & python -m unittest discover -s scripts -p test_songstudio_lyrics_preview.py -v
          if ($LASTEXITCODE -ne 0) { throw "Real lyrics and AI draft regressions failed" }
          & python -m unittest discover -s scripts -p test_songstudio_pasted_lyrics.py -v
          if ($LASTEXITCODE -ne 0) { throw "Pasted original lyrics AI alignment regression failed" }
          & python -m unittest discover -s scripts -p test_songstudio_lyric_text_groups.py -v
          if ($LASTEXITCODE -ne 0) { throw "Batch head/tail lyrics replacement regression failed" }
          & python -m unittest discover -s scripts -p test_songstudio_lyric_source_folder.py -v
          if ($LASTEXITCODE -ne 0) { throw "Bulk lyrics selected source folder regressions failed" }
          & python -m unittest discover -s scripts -p test_songstudio_lrc_folder.py -v
          if ($LASTEXITCODE -ne 0) { throw "Raw LRC folder safe-edit regression failed" }
          & python -m unittest discover -s scripts -p test_songstudio_ai_export.py -v
          if ($LASTEXITCODE -ne 0) { throw "AI selected lyrics/instrumental export tests failed" }
          & python -m unittest discover -s scripts -p test_songstudio_ai_import.py -v
          if ($LASTEXITCODE -ne 0) { throw "Independent AI import and reviewed lyrics regressions failed" }
          & python -m unittest discover -s scripts -p test_songstudio_drive_layout.py -v
          if ($LASTEXITCODE -ne 0) { throw "XStageWeb v2 Drive layout regressions failed" }
          & python -m unittest discover -s scripts -p test_songstudio_drive_roundtrip.py -v
          if ($LASTEXITCODE -ne 0) { throw "Google Drive upload/download/ZIP round-trip regression failed" }
          & python -m unittest discover -s scripts -p test_songstudio_code_registry.py -v
          if ($LASTEXITCODE -ne 0) { throw "Two-source code reconciliation regression failed" }
          & python -m unittest discover -s scripts -p test_songstudio_folder_upload.py -v
          if ($LASTEXITCODE -ne 0) { throw "Selected-folder and SoundFont upload tests failed" }
          & python -m unittest discover -s scripts -p test_songstudio_online_publish.py -v
          if ($LASTEXITCODE -ne 0) { throw "XStageWeb online publish/dedup/merge/pointer regression failed" }
      - name: Preflight Google Drive upload/download OAuth readiness
        shell: powershell
        run: |
          $hasId = ![string]::IsNullOrWhiteSpace($env:XSTAGE_GOOGLE_DESKTOP_CLIENT_ID)
          $hasSecret = ![string]::IsNullOrWhiteSpace($env:XSTAGE_GOOGLE_DESKTOP_CLIENT_SECRET)
          if ($hasId -ne $hasSecret) {
            throw "Desktop OAuth incomplete: provide BOTH matching Client ID and Client Secret or neither."
          }
          if ($hasId) {
            if (!$env:XSTAGE_GOOGLE_DESKTOP_CLIENT_ID.EndsWith('.apps.googleusercontent.com')) {
              throw "Google OAuth Client ID format invalid. Expected Desktop Client ID."
            }
            Write-Host "PASS: Desktop OAuth client pair present for bundled Google Login."
          } else {
            Write-Warning "Google OAuth not preconfigured: core ZIP can be built, but users must import their Desktop OAuth Client JSON once. Never claim automatic Google Login."
          }
      - name: Browser end-to-end test before creating ZIP
        shell: powershell
        run: |
          & npm install --no-save --ignore-scripts playwright@1.56.0
          if ($LASTEXITCODE -ne 0) { throw "Playwright test dependency failed" }
          & npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "Chromium installation for smoke tests failed" }
          & node scripts/song-studio-browser-e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw "Real-browser Song Studio PC/Web/AI/Drive UI regression failed" }
      - name: Build complete bundled Windows runtime and ZIP
        shell: powershell
        run: |
          & ./scripts/build_songstudio_ready.ps1
          if ($LASTEXITCODE -ne 0) { throw "READY bundle packaging failed" }
      - name: Validate complete bundled Desktop OAuth pair (never user tokens)
        shell: powershell
        run: |
          $base = "dist/X-Stage-Song-Studio-PC-Ready-v0.3.32-build332"
          $config = Join-Path $base "config/google-oauth-client.json"
          $hasId = ![string]::IsNullOrWhiteSpace($env:XSTAGE_GOOGLE_DESKTOP_CLIENT_ID)
          $hasSecret = ![string]::IsNullOrWhiteSpace($env:XSTAGE_GOOGLE_DESKTOP_CLIENT_SECRET)
          if ($hasId -and $hasSecret) {
            if (!(Test-Path $config)) { throw "Complete Desktop OAuth Client missing from ZIP" }
            $client = Get-Content $config -Encoding UTF8 -Raw | ConvertFrom-Json
            if ($client.installed.client_id -ne $env:XSTAGE_GOOGLE_DESKTOP_CLIENT_ID) {
              throw "Unexpected Desktop OAuth Client ID in bundle"
            }
            if ($client.installed.client_secret -ne $env:XSTAGE_GOOGLE_DESKTOP_CLIENT_SECRET) {
              throw "Desktop OAuth client_secret missing or mismatched"
            }
            if ($client.installed.refresh_token -or $client.installed.access_token) {
              throw "User tokens must never be bundled"
            }
            Write-Host "PASS: App-wide Desktop OAuth ID + Secret are both available to token exchange."
          } else {
            if (Test-Path $config) { throw "Incomplete Desktop OAuth must NOT be bundled" }
            Write-Warning "Google OAuth NOT bundled. Core audio/runtime tests can pass; end users must import a valid Desktop OAuth JSON once for Google Login/Drive."
          }
      - name: Verify real audio and MIDI conversions
        shell: powershell
        run: |
          $base = "dist/X-Stage-Song-Studio-PC-Ready-v0.3.32-build332"
          $py = Join-Path $base ".runtime/python/python.exe"
          if (!(Test-Path $py)) { throw "Portable Python not found" }
          & $py scripts/test_songstudio_ready.py $base
          if ($LASTEXITCODE -ne 0) { throw "Ready runtime conversion tests FAILED" }
      - name: Test bundled Windows picker and Thai Unicode return
        shell: powershell
        run: |
          $base = "dist/X-Stage-Song-Studio-PC-Ready-v0.3.32-build332"
          $picker = Join-Path $base "pick_path.ps1"
          if (!(Test-Path $picker)) { throw "Windows picker script was not bundled" }
          $reply = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -STA -File $picker -Kind source -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Picker script self-test failed" }
          if ($reply -notmatch '^PICKER_SELFTEST:([A-Za-z0-9+/=]+)$') { throw "Picker protocol invalid: $reply" }
          $actual = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($Matches[1]))
          $expected = 'C:\' + (-join @([char]0x0E17,[char]0x0E14,[char]0x0E2A,[char]0x0E2D,[char]0x0E1A,[char]0x005C,[char]0x0E40,[char]0x0E1E,[char]0x0E25,[char]0x0E07))
          if ($actual -ne $expected) { throw "Thai Unicode picker path was corrupted" }
          Write-Host "PASS: Windows picker script runs and returns Unicode paths safely."
      - name: Verify ZIP and SHA256 manifest
        shell: powershell
        run: |
          $zip = "dist/X-Stage-Song-Studio-PC-Ready-v0.3.32-build332.zip"
          $hashfile = "$zip.sha256"
          if (!(Test-Path $zip) -or !(Test-Path $hashfile)) { throw "Missing archive or checksum" }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content $hashfile -Raw) -split '\s+')[0]
          if ($actual -ne $expected) { throw "Final ZIP checksum mismatch" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($name in @("studio/app-icon.svg", "studio/app-icon.ico", "studio/app-icon-512.png",
                                "Create-Desktop-Shortcut.cmd", "Create-Desktop-Shortcut.ps1",
                                "Start-Song-Studio.cmd", "X-Stage Song Studio.exe", "song_export.py", "code_registry.py", "google_drive.py", "online_publish.py", "pick_path.ps1", "ai_separate.py", "ai-model.lock.json", "live_preview.py", "ncn_lyrics.py", "song_index.py", "ai_lyrics.py", "lyric_alignment.py", "lyric_text_groups.py",
                                ".runtime/models/htdemucs_fp16weights.onnx", ".runtime/models/ggml-base.bin",
                                ".runtime/whisper/whisper-cli.exe",
                                ".runtime/ai-site/numpy/__init__.py", ".runtime/ai-site/onnxruntime/__init__.py",
                                ".engine-ready-manifest.json", "engine.py",
                                ".runtime/python/python.exe", ".runtime/tools/ffmpeg.exe",
                                ".runtime/fluidsynth/bin/fluidsynth.exe", ".runtime/soundfonts/GeneralUser-GS.sf2")) {
              if (!($names | Where-Object { $_.EndsWith($name) })) {
                throw "Final ZIP missing: $name"
              }
            }
          } finally { $archive.Dispose() }
          Write-Host "PASS: Complete offline ZIP SHA-256 $actual"
      - name: Upload verified Ready ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-Stage-Song-Studio-PC-Ready-v0.3.32-build332
          path: |
            dist/X-Stage-Song-Studio-PC-Ready-v0.3.32-build332.zip
            dist/X-Stage-Song-Studio-PC-Ready-v0.3.32-build332.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      # Core audio/lyrics/Web/Windows tests and an artifact are generated
      # even when the repository owner has not supplied Desktop OAuth yet.
      # The publicly advertised all-functions Ready release remains blocked
      # until users can Google Login with the app's bundled Desktop client.
      - name: Gate full-featured public release on Desktop OAuth
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:XSTAGE_GOOGLE_DESKTOP_CLIENT_ID) -or
              [string]::IsNullOrWhiteSpace($env:XSTAGE_GOOGLE_DESKTOP_CLIENT_SECRET)) {
            throw "Cannot publish all-functions-ready ZIP: Google Desktop OAuth Client ID and Secret must both be configured in repo Actions"
          }
      - name: Publish GitHub release after tests pass
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "song-studio-pc-ready-v0.3.32-build332"
          $zip = "dist/X-Stage-Song-Studio-PC-Ready-v0.3.32-build332.zip"
          $sha = "$zip.sha256"
          $notes = @'
          Windows 10/11 x64 offline portable. Includes Python, FFmpeg, FluidSynth,
          GeneralUser SoundFont, NumPy, ONNX Runtime CPU, and the 166 MB
          verified HTDemucs ONNX model. AI Separation creates local karaoke
          instrumental and vocals files. No installation or model download
          on user's PC. Redesigned X-Stage Song Studio PC app icon included
          as SVG favicon, Windows ICO, and 512px PNG. Optional desktop
          shortcut uses the matching Windows ICO. Live karaoke preview
          streams music with MIDI SoundFont without creating preview files.
          Extract full ZIP and run Start-Song-Studio.cmd.
          LYR skip reports now show each filename, reason categories and
          authenticated UTF-8 CSV, with focused recheck of only failed LYR.
          Recheck reports confirmed skips and recovered files without edits.
          Fast native NCN scan reads only Lyrics/*.LYR and subfolders.
          MID and CUR are opened only for selected songs during verified
          replacement. Selected changes preserve unrelated timing and MIDI.
          Legacy NCN CUR 65535 and backwards timing in unselected lines is
          preserved; edited lines must have safe printed-character cues.
          Line-marker timing irregularities do not block safe edits.
          NCN mirrored Song/Lyrics/Cursor native head/tail editing now supported.
          Changes backup both LYR and CUR, preserving all other lyric times.
          Bulk head/tail lyrics replacement offers X-Stage Karaoke presets
          plus editable custom wording, keeping confirmation and rollback.
          NEW: live separate music/SoundFont mixer, maximized PC interface,
          two verified build modes, and private Google Desktop OAuth/Drive sync.
          Google Desktop OAuth ID and matching Secret may be bundled by the
          developer via Actions Variable and Secret. When absent, users import
          their own complete Desktop JSON once.
          If the owner has not configured BOTH Desktop OAuth values, Google Login
          requires a one-time Desktop Client JSON import in Advanced Settings.
          This release does NOT provide automatic Google Login in that case.
          Per-user tokens and preferences persist across releases under Windows
          LocalAppData and DPAPI. If variable is absent, one-time import is required.
          Source deduplication, recovery journal, catalogs and current.json remain.
          Preview displays timed LRC/KAR/NCN lyrics from real components.
          Bundled multilingual Whisper can transcribe audible vocals OFFLINE
          into clearly marked UNVERIFIED drafts for manual review; no fake
          lyrics are generated from MIDI notes.

          Limitations: not original Build205 engine. NCN audio is rendered
          from MIDI via FluidSynth; compatibility varies by source.
          Google authorization requires user consent; existing Drive files
          created by other OAuth apps are outside the drive.file scope.
          '@
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$zip" "$sha" --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag "$zip" "$sha" --title "X-Stage Song Studio PC Ready v0.3.32 Build 332" --notes $notes --prerelease --latest=false --target "$env:GITHUB_SHA" --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish verified Ready ZIP" }
