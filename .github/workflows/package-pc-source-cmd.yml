name: X-Stage Karaoke PC CMD Source ZIP (private-only distribution disabled on public repo)

# No direct public source archive publication.
# Public installers are built by build-windows-pc.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-distribution-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Explain private-source requirement
        run: |
          echo "::notice::CMD source-only ZIP generation is disabled in the public repository."
          echo "::notice::A private source repository with explicit collaborator permissions is required."
          echo "::notice::This does not restrict viewing the current public source repository or existing Git history."
