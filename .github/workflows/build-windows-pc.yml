name: X-Stage Karaoke PC installer candidate (v1.0.79)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Import X-Stage Windows PC v1.0.79 continuous medley source'
    types:
      - completed
  push:
    paths:
      - 'windows-pc/source/**'
      - 'scripts/build_karaoke_pc_icon.py'
      - 'scripts/verify_songstudio_exe_icon.py'
      # Metadata-only updates must not run an installer build without imported Windows source.
      - 'windows-pc/installer/**'
      - '.github/workflows/build-windows-pc.yml'

permissions:
  contents: read

# Only the newest source is useful for the installer candidate. Stop obsolete
# runs rather than doing the complete Windows regression 10+ times on push.
concurrency:
  group: xstage-windows-pc-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-windows-source:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
      - id: verify
        shell: bash
        run: |
          if [ -f windows-pc/source/Build-Source.ps1 ] &&
             [ -f windows-pc/source/karaoke/continuous_medley.py ] &&
             python3 -c "import json,sys; m=json.load(open('windows-pc/manifest.json')); sys.exit(0 if m.get('source_imported') is True and m.get('version')=='1.0.79' and m.get('build')==1079 else 1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Windows source verified and imported; installer build can proceed."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Windows installer build skipped: source ZIP is available but source files are not yet imported and verified."
          fi

  windows-build-and-installer:
    # Only this build job can request short-lived OIDC signing credentials.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    needs: inspect-windows-source
    if: needs.inspect-windows-source.outputs.ready == 'true' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Verify imported source and release identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-Content windows-pc/manifest.json -Raw | ConvertFrom-Json
          if ($meta.source_imported -ne $true -or $meta.version -ne '1.0.79' -or $meta.build -ne 1079) {
            throw 'Windows v1.0.79 source is not imported. Upload the SHA-256 verified source ZIP before building.'
          }
          if (-not (Test-Path windows-pc/source/Build-Source.ps1) -or
              -not (Test-Path windows-pc/source/karaoke/continuous_medley.py)) {
            throw 'Windows source or continuous medley files are missing.'
          }

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Render dedicated Karaoke PC Windows launcher icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "Pillow>=10,<13"
          if ($LASTEXITCODE -ne 0) { throw "Pillow install for native PC icon failed" }
          python scripts/build_karaoke_pc_icon.py
          if ($LASTEXITCODE -ne 0) { throw "X-Stage Karaoke PC icon generation failed" }
          if (-not (Test-Path windows-pc/source/assets/xstage.ico)) {
            throw 'Distinct Karaoke PC Windows icon was not created'
          }

      - name: Build Windows app and run full regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location windows-pc/source
          try {
            & ./Build-Source.ps1 -PythonExe (Get-Command python).Source
            if ($LASTEXITCODE -ne 0) { throw "Windows application build failed ($LASTEXITCODE)" }
            $summary = Get-Content build-tests-summary.json -Raw | ConvertFrom-Json
            if ($summary.pass -ne $true -or @($summary.failures).Count -gt 0 -or @($summary.errors).Count -gt 0) {
              throw 'Regression tests did not pass.'
            }
            foreach ($file in @('dist/XStageKaraoke/XStageKaraoke.exe',
                               'dist/XStageKaraoke/install_to_D.ps1',
                               'dist/XStageKaraoke/tools/Installer-Safety.ps1',
                               'dist/XStageKaraoke/release-manifest.json')) {
              if (-not (Test-Path $file -PathType Leaf)) { throw "Build incomplete: $file" }
            }
            & ((Get-Command python).Source) ../../scripts/verify_songstudio_exe_icon.py dist/XStageKaraoke/XStageKaraoke.exe
            if ($LASTEXITCODE -ne 0) { throw 'Application EXE missing native icon' }
            & ((Get-Command python).Source) tools/verify_release.py --verify --package dist/XStageKaraoke
            if ($LASTEXITCODE -ne 0) { throw 'Release manifest integrity check failed.' }
          } finally { Pop-Location }

      - name: Run required Windows Tk GUI regression in isolated processes
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location windows-pc/source
          try {
            $python = (Resolve-Path '.build-venv/Scripts/python.exe').Path
            # DISPLAY is an explicit test opt-in, not a screen simulation.
            # Prove Tk can create/map a real native window before enabling it.
            & $python -c "import tkinter as tk; r=tk.Tk(); r.geometry('320x200'); r.update(); assert r.winfo_ismapped(), 'Tk window did not map'; assert r.tk.call('tk','windowingsystem') == 'win32'; r.destroy(); print('Native Win32 Tk GUI probe passed')"
            if ($LASTEXITCODE -ne 0) { throw 'Native Tk GUI unavailable on this Windows runner' }
            $env:DISPLAY = 'xstage-native-win32-test-opt-in'
            $env:PYTHONDONTWRITEBYTECODE = '1'
            $env:PYTHONPATH = (Join-Path (Get-Location).Path 'tests') + ';' + (Get-Location).Path
            @'
          import os, pathlib, subprocess, sys, unittest
          # Run each GUI test in a fresh process to isolate Tk thread destruction,
          # and to fail rather than hang indefinitely on unresolved modal dialogs.
          classes = [
              "test_auditfix073.DetailGui073Tests",
              "test_eq_interaction.RackIntegrationTests",
              "test_history070.HistoryRecoveryGuiTests",
              "test_quality090.QualityGuiTests",
              "test_recovery_ui060.RecoveryUiTests",
              "test_song_workspace79.WorkspaceGuiTests",
              "test_soundfont80.SoundfontGui80Tests",
              "test_soundfont81.SoundfontGui81Tests",
          ]
          retired = {
              "test_quality090.QualityGuiTests.test_scan_review_cancel_delete_and_restore",
          }
          tests = []
          for name in classes:
              suite = unittest.defaultTestLoader.loadTestsFromName(name)
              for child in suite:
                  for test in child:
                      tests.append(test.id())
          failures = []
          completed = 0
          for test in tests:
              if test in retired:
                  print("Retired scenario; replacement coverage is in P0 regression:", test, flush=True)
                  continue
              print("GUI TEST:", test, flush=True)
              try:
                  proc = subprocess.run([sys.executable, "-m", "unittest", "-v", test],
                                        stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                        text=True, encoding="utf-8", errors="replace", timeout=90,
                                        env=dict(os.environ, PYTHONIOENCODING="utf-8"))
                  print(proc.stdout, flush=True)
                  if proc.returncode or "OK (skipped=" in proc.stdout or "Ran 0 tests" in proc.stdout:
                      failures.append(test)
                  else:
                      completed += 1
              except subprocess.TimeoutExpired:
                  print("GUI test timed out:", test, flush=True)
                  failures.append(test)
          print(f"GUI SUMMARY: {completed} passed; {len(failures)} failed; {len(retired)} retired", flush=True)
          if failures:
              print("FAILED GUI TESTS:", "\n".join(failures), flush=True)
              raise SystemExit(1)
          if completed != len(tests) - len(retired) or completed < 15:
              raise SystemExit("Required GUI coverage incomplete")
          '@ | & $python -
            if ($LASTEXITCODE -ne 0) { throw 'Windows GUI regression failed' }
          } finally { Pop-Location }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }

      - name: Verify bundled BASS runtime before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = 'windows-pc/source/dist/XStageKaraoke/native/x64'
          foreach ($name in @('bass.dll', 'bassmidi.dll', 'bass_fx.dll')) {
            $file = Join-Path $native $name
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Installer would be missing $name at native/x64. Refusing to package."
            }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file).Path)
            if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "Invalid native x64 library: $file"
            }
            $offset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($offset -lt 0 -or $offset + 6 -gt $bytes.Length -or
                [BitConverter]::ToUInt32($bytes, $offset) -ne 0x00004550 -or
                [BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x8664) {
              throw "Not a valid Windows x64 DLL: $file"
            }
          }

      - name: Compile Windows installer EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path "${env:ProgramFiles(x86)}" 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) { $compiler = Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe' }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup ISCC.exe not found.' }
          & $compiler 'windows-pc/installer/XStageKaraoke.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $setup = 'windows-pc/installer/output/X-StageKaraoke.exe'
          if (-not (Test-Path $setup -PathType Leaf)) { throw 'Installer EXE was not produced.' }
          if ((Get-Item $setup).Length -lt 1000000) { throw 'Installer EXE is unexpectedly small.' }
          python scripts/verify_songstudio_exe_icon.py $setup
          if ($LASTEXITCODE -ne 0) { throw 'Installer EXE missing native icon' }
          $hash = (Get-FileHash -Path $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  X-StageKaraoke.exe" |
            Set-Content -Encoding ascii "$setup.sha256"
          Get-Item $setup | Select-Object FullName, Length
          Write-Host "Installer SHA256: $hash"

      - name: Install candidate silently and verify installed runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'windows-pc/installer/output/X-StageKaraoke.exe').Path
          $probe = Join-Path $env:RUNNER_TEMP 'XStage Karaoke ไทย folder'
          $report = Join-Path $env:RUNNER_TEMP 'xstage-installed-dependencies.json'
          $log = Join-Path $env:RUNNER_TEMP 'xstage-installer-smoke.log'
          # Only write a unique marker inside the runner's test account data.
          # Installer must preserve it when removed.
          $userdata = Join-Path $env:LOCALAPPDATA 'X-Stage/Karaoke PC/Data'
          $sentinel = $null
          $sentinelText = 'xstage-ci-preserve-' + $env:GITHUB_RUN_ID
          try {
            # Keep quotes intact for the custom path containing spaces and Thai text.
            $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="' + $probe + '" /LOG="' + $log + '"'
            $install = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Inno Setup silent install failed: $($install.ExitCode)" }
            $exe = Join-Path $probe 'X-StageKaraoke.exe'
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              Write-Host "Expected install directory: $probe"
              if (Test-Path -LiteralPath $probe) {
                Get-ChildItem -LiteralPath $probe -Force | Select-Object FullName, Length | Format-Table | Out-String | Write-Host
              }
              if (Test-Path -LiteralPath $log) {
                Get-Content -LiteralPath $log -Tail 100 | ForEach-Object { Write-Host $_ }
              }
              throw 'Installed X-StageKaraoke.exe is missing from requested directory'
            }
            foreach ($name in @('bass.dll', 'bassmidi.dll', 'bass_fx.dll')) {
              $dll = Join-Path (Join-Path $probe 'native/x64') $name
              if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
                throw "Installed audio DLL missing: $name"
              }
            }
            foreach ($name in @('Setup-Dependencies.ps1', 'Setup-Audio.ps1')) {
              if (-not (Test-Path -LiteralPath (Join-Path $probe $name) -PathType Leaf)) {
                throw "Installed support file missing: $name"
              }
            }
            foreach ($name in @(
              'Dependency-Common.ps1', 'Probe-Native.ps1', 'Repair-Dependencies.ps1',
              'Repair-XStage-WiFi.ps1', 'Setup-System-EQ.ps1', 'Open-APO-Device.ps1',
              'Install-EqualizerAPO.ps1', 'Installer-Safety.ps1')) {
              if (-not (Test-Path -LiteralPath (Join-Path (Join-Path $probe 'tools') $name) -PathType Leaf)) {
                throw "Installed menu helper missing: $name"
              }
            }
            $check = Start-Process -FilePath $exe -WorkingDirectory $probe -ArgumentList @('--check-dependencies', '--dependency-report', ('"' + $report + '"')) -PassThru
            if (-not $check.WaitForExit(45000)) {
              Stop-Process -Id $check.Id -Force -ErrorAction SilentlyContinue
              throw 'Installed EXE dependency preflight timed out'
            }
            if ($check.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report -PathType Leaf)) {
              throw "Installed EXE dependency preflight failed: $($check.ExitCode)"
            }
            $result = Get-Content -LiteralPath $report -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($result.ok -ne $true) {
              $failed = @($result.checks | Where-Object { $_.ok -ne $true })
              throw "Installed runtime dependency check failed: $($failed | ConvertTo-Json -Compress)"
            }
            Write-Host 'Installed EXE verified: x64 BASS DLLs, menu helpers, Python imports and native API'
            if (-not (Test-Path -LiteralPath $userdata -PathType Container)) {
              throw "Installer did not create user Data directory: $userdata"
            }
            $sentinel = Join-Path $userdata ('ci-uninstall-preserve-' + $env:GITHUB_RUN_ID + '.txt')
            if (Test-Path -LiteralPath $sentinel) { throw 'Test data sentinel already exists; refusing to overwrite' }
            Set-Content -LiteralPath $sentinel -Value $sentinelText -NoNewline -Encoding UTF8
          } finally {
            try {
              $uninstall = Join-Path $probe 'unins000.exe'
              if (-not (Test-Path -LiteralPath $uninstall -PathType Leaf)) {
                throw 'Installed uninstaller is missing; cannot verify cleanup'
              }
              $remove = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
              if ($remove.ExitCode -ne 0) { throw "Silent uninstall failed: $($remove.ExitCode)" }
              # The uninstaller removes its own EXE asynchronously on some Windows versions.
              for ($attempt = 0; $attempt -lt 20; $attempt++) {
                if (-not (Test-Path -LiteralPath (Join-Path $probe 'unins000.exe'))) { break }
                Start-Sleep -Milliseconds 250
              }
              if (Test-Path -LiteralPath $probe) {
                $leftovers = @(Get-ChildItem -LiteralPath $probe -Recurse -File -Force)
                if ($leftovers.Count -gt 0) {
                  throw "Files left after uninstall: $($leftovers.FullName -join ', ')"
                }
              }
              if ($sentinel) {
                if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf) -or
                    (Get-Content -LiteralPath $sentinel -Raw -Encoding UTF8) -ne $sentinelText) {
                  throw 'Uninstall removed or changed user Data sentinel'
                }
              }
              Write-Host 'Silent uninstall verified: no installed files remain; user Data preserved'
            } finally {
              # Remove only our unique CI test marker. Never modify any other Data.
              if ($sentinel -and (Test-Path -LiteralPath $sentinel -PathType Leaf)) {
                Remove-Item -LiteralPath $sentinel -Force
              }
            }
          }

      # This does not Authenticode-sign the EXE. It signs provenance bound
      # to the exact installer and the internal package SHA-256 manifest.
      - name: Attest installer and release manifest with Sigstore
        id: attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            windows-pc/installer/output/X-StageKaraoke.exe
            windows-pc/source/dist/XStageKaraoke/release-manifest.json

      - name: Verify signed provenance for both build outputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ github.repository }}'
          $workflow = "$repo/.github/workflows/build-windows-pc.yml"
          foreach ($subject in @(
            'windows-pc/installer/output/X-StageKaraoke.exe',
            'windows-pc/source/dist/XStageKaraoke/release-manifest.json'
          )) {
            gh attestation verify $subject --repo $repo --signer-workflow $workflow
            if ($LASTEXITCODE -ne 0) {
              throw "Signed provenance check failed for $subject"
            }
          }
          Write-Host 'Verified signed build provenance for installer and release-manifest.json'

      - name: Upload Windows installer candidate and test logs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X-Stage-Karaoke-PC-Windows-v1.0.79-build1079-CANDIDATE
          if-no-files-found: error
          retention-days: 30
          path: |
            windows-pc/installer/output/*.exe
            windows-pc/installer/output/*.sha256
            windows-pc/source/build-tests-summary.json
            windows-pc/source/build-tests.log
      # Manual install test and signing remain mandatory before publishing a
      # public update. Do not set downloads/windows-pc-latest.json.available=true.
