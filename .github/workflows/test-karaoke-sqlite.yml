name: Karaoke Online real SQLite3 database

on:
  push:
    paths:
      - "drive-sqlite.js"
      - "app.js"
      - "cloud-import.js"
      - "karaoke.html"
      - "scripts/karaoke-drive-sqlite-test.mjs"
      - "scripts/test-shared-sqlite-cross-runtime.mjs"
      - "scripts/test-shared-sqlite-pc-builder.mjs"
      - "windows-pc/source/karaoke/shared_catalog_builder.py"
      - "windows-pc/source/karaoke/shared_catalog_builder_ui.py"
      - "windows-pc/source/tests/test_shared_catalog_builder.py"
      - "scripts/cloud-drive-folders-test.mjs"
      - "cloud-drive-folders.js"
      - "windows-pc/source/karaoke/shared_song_library.py"
      - "windows-pc/source/karaoke/drive_online_catalog.py"
      - "windows-pc/source/tests/test_shared_song_library.py"
      - ".github/workflows/test-karaoke-sqlite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned SQLite WebAssembly for test only
        run: npm install --no-save --ignore-scripts --no-audit --no-fund sql.js@1.13.0
      - name: Validate browser code
        run: |
          node --check drive-sqlite.js
          node --check app.js
          node --check cloud-import.js
      - name: Exercise genuine SQLite3 binary
        run: node scripts/karaoke-drive-sqlite-test.mjs
      - name: Cross-runtime PC and Online single-DB acceptance
        run: |
          node scripts/test-shared-sqlite-cross-runtime.mjs
          node scripts/test-shared-sqlite-pc-builder.mjs
          node scripts/cloud-drive-folders-test.mjs
          PYTHONPATH=windows-pc/source python3 -m unittest discover -s windows-pc/source/tests -p 'test_shared_*.py' -v
