name: X-Stage Android TV build

on:
  workflow_dispatch:
  push:
    paths:
      - "android-tv/**"
      - "version.json"
      - "app.js"
      - "pwa-install.js"
      - "style.css"
      - "index.html"
      - "xstage-ux.css"
      - "stage-controls.js"
      - "remote.js"
      - "remote.html"
      - "scripts/**"
      - "sw.js"
      - "midi-soundfont-engine.js"
      - "midi-stage-adapter.js"
      - "assets/midi/**"
      - "scripts/build-midi-assets.mjs"
      - ".github/workflows/build-android-tv.yml"
  pull_request:
    paths:
      - "android-tv/**"
      - "version.json"
      - "app.js"
      - "pwa-install.js"
      - "style.css"
      - ".github/workflows/build-android-tv.yml"

permissions:
  contents: write

# New main pushes cancel older builds so a stale APK cannot win the release.
concurrency:
  group: xstage-android-tv-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build-android-tv:
    runs-on: ubuntu-latest
    env:
      XSTAGE_TV_OAUTH_CLIENT_ID: ${{ secrets.XSTAGE_TV_OAUTH_CLIENT_ID }}
      XSTAGE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.XSTAGE_TV_OAUTH_CLIENT_SECRET }}
      XSTAGE_ANDROID_KEYSTORE_BASE64: ${{ secrets.XSTAGE_ANDROID_KEYSTORE_BASE64 }}
      XSTAGE_KEYSTORE_PASSWORD: ${{ secrets.XSTAGE_ANDROID_KEYSTORE_PASSWORD }}
      XSTAGE_KEY_ALIAS: ${{ secrets.XSTAGE_ANDROID_KEY_ALIAS }}
      XSTAGE_KEY_PASSWORD: ${{ secrets.XSTAGE_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run cross-platform regression checks before Android build
        run: npm test

      - name: Bundle complete MIDI environment into Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock spessasynth_lib@4.4.8 esbuild@0.25.12
          mkdir -p assets/vendor android-tv/app/src/main/assets/xstage/vendor
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            --output assets/vendor/FluidR3Mono_GM.sf3 \
            https://raw.githubusercontent.com/musescore/MuseScore/v2.3.2/share/sound/FluidR3Mono_GM.sf3
          echo 'cfcd66d89e8386823400eca64934b14fbea7bf48ba1f00d21189af1262794ec2  assets/vendor/FluidR3Mono_GM.sf3' | sha256sum --check
          node scripts/build-midi-assets.mjs
          cp assets/vendor/spessasynth-lib.min.js \
             assets/vendor/spessasynth_processor.min.js \
             assets/vendor/FluidR3Mono_GM.sf3 \
             assets/vendor/midi-assets.json \
             android-tv/app/src/main/assets/xstage/vendor/
          test "$(find android-tv/app/src/main/assets/xstage/vendor -type f | wc -l)" -eq 4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare optional Play upload keystore
        shell: bash
        run: |
          if [ -n "$XSTAGE_ANDROID_KEYSTORE_BASE64" ]; then
            echo "$XSTAGE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xstage-upload.jks"
            echo "XSTAGE_KEYSTORE_PATH=$RUNNER_TEMP/xstage-upload.jks" >> "$GITHUB_ENV"
            echo "Release signing: configured"
          else
            echo "Release signing: not configured; release artifacts will be unsigned"
          fi

      - name: Validate Google TV OAuth credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "$XSTAGE_TV_OAUTH_CLIENT_ID" ] || missing+=("XSTAGE_TV_OAUTH_CLIENT_ID")
          [ -n "$XSTAGE_TV_OAUTH_CLIENT_SECRET" ] || missing+=("XSTAGE_TV_OAUTH_CLIENT_SECRET")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Android APK publish blocked: missing GitHub Actions secrets: ${missing[*]}"
            echo "::error::Create a Google OAuth client of type 'TVs and Limited Input devices', then add both values under Repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Google TV OAuth: configured"

      - name: Verify Google TV device-code endpoint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # A configured secret alone does not prove Google will issue QR codes.
          # Test the actual device endpoint without printing credentials or codes.
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request, urllib.error
          endpoint = "https://oauth2.googleapis.com/device/code"
          scope = "openid email https://www.googleapis.com/auth/drive.file"
          body = urllib.parse.urlencode({
              "client_id": os.environ["XSTAGE_TV_OAUTH_CLIENT_ID"],
              "scope": scope,
          }).encode("ascii")
          request = urllib.request.Request(endpoint, data=body, headers={
              "Content-Type": "application/x-www-form-urlencoded",
              "Cache-Control": "no-store",
          }, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              try:
                  error = json.load(exc)
              except Exception:
                  error = {}
              kind = str(error.get("error") or error.get("error_code") or "google_oauth_rejected")
              print(f"::error::Google TV QR code request failed: {kind} (HTTP {exc.code}). Check the TVs and Limited Input devices OAuth client, consent screen and scopes.")
              sys.exit(1)
          except Exception as exc:
              print(f"::error::Cannot verify Google device-code endpoint: {type(exc).__name__}. Check runner network/TLS.")
              sys.exit(1)
          if not result.get("device_code") or not result.get("user_code") or not result.get("verification_url"):
              print("::error::Google did not return a usable device_code/user_code/verification_url.")
              sys.exit(1)
          print("Google TV QR endpoint: validated — device code issued (secrets and code hidden)")
          PY

      - name: Build APK and AAB from the same source
        shell: bash
        run: |
          gradle -p android-tv clean assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Verify launcher banner, icon and splash inside built APK
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, struct
          source=Path('assets/xstage-stage-logo.png')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '5cc34771ae31287ef70ff032d56763a45e5942b3f27a8623c0c81ea72f8f0622', 'Official user artwork changed'
          folder=Path('android-tv/app/src/main/res/drawable-nodpi')
          def png_size(raw):
              assert raw[:8] == bytes((137,80,78,71,13,10,26,10)), 'Not a PNG'
              return struct.unpack('>II',raw[16:24])
          expected={
              'xstage_tv_banner.png': (320,180),
              'xstage_app_icon.png': (512,512),
              'xstage_tv_splash.png': (2048,682),
          }
          for name,dimensions in expected.items():
              output=folder/name
              assert output.exists(),f'Missing Android launcher drawable: {output}'
              content=output.read_bytes()
              assert png_size(content)==dimensions,f'Unexpected dimensions: {output}'
              assert len(content)>4096,f'Suspiciously empty launcher graphic: {output}'
          assert (folder/'xstage_tv_splash.png').read_bytes()==source.read_bytes(),'Native splash must be exact source PNG'
          debug_apks=list(Path('android-tv/app/build/outputs/apk/debug').glob('*.apk'))
          release_apks=list(Path('android-tv/app/build/outputs/apk/release').glob('*.apk'))
          assert debug_apks and release_apks,'Both debug and release APKs must be built'
          for apk in debug_apks+release_apks:
              with ZipFile(apk) as z:
                  names=z.namelist()
                  for name in expected:
                      matches=[n for n in names if n.endswith('/'+name)]
                      if not matches:
                          # AAPT2 may rename compiled resources in unsigned
                          # release APKs. Confirm the unique PNG dimensions
                          # are still packaged rather than trusting filenames.
                          matches=[n for n in names if n.lower().endswith('.png')
                                   and png_size(z.read(n))==expected[name]]
                      assert matches,f'{apk}: no packaged PNG for {name} with required dimensions {expected[name]}'
                      assert png_size(z.read(matches[0]))==expected[name],f'{apk}: incorrect packaged graphic {name}'
                      print(f'{apk.name}: {name} -> {matches[0]}')
          print('TV launcher verified: original PNG; 320x180 banner, 512x512 icon, full-resolution splash; debug and release APK resources present')
          PY

      - name: Verify offline-ready MIDI engine and SoundFont inside APK
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          package = Path('android-tv/app/build/outputs/apk/debug/app-debug.apk')
          soundfont = Path('assets/vendor/FluidR3Mono_GM.sf3')
          assert package.is_file(), 'Missing debug APK'
          with ZipFile(package) as archive:
              for name in ('spessasynth-lib.min.js','spessasynth_processor.min.js',
                           'FluidR3Mono_GM.sf3','midi-assets.json'):
                  inner = 'assets/xstage/vendor/' + name
                  assert inner in archive.namelist(), 'Packaged MIDI asset missing: ' + inner
                  if name == 'FluidR3Mono_GM.sf3':
                      assert hashlib.sha256(archive.read(inner)).hexdigest() == hashlib.sha256(
                          soundfont.read_bytes()).hexdigest(), 'Packaged SoundFont mismatch'
          print('APK contains the pinned, complete offline-ready MIDI synthesizer and GM SoundFont')
          PY

      - name: Show build outputs
        shell: bash
        run: |
          find android-tv/app/build/outputs -maxdepth 5 -type f -print | sort
          find android-tv/store-assets -maxdepth 2 -type f -print | sort

      - name: Upload Android TV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xstage-android-tv-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            android-tv/app/build/outputs/apk/debug/*.apk
            android-tv/app/build/outputs/apk/release/*.apk
            android-tv/app/build/outputs/bundle/release/*.aab
            android-tv/store-assets/*.png

      - name: Publish browser-downloadable Android test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          VERSION="$(python -c "import json; print(json.load(open('version.json', encoding='utf-8'))['version'])")"
          BUILD="$(python -c "import json; print(json.load(open('version.json', encoding='utf-8'))['build'])")"
          APK_NAME="X-Stage-Karaoke-Android-v${VERSION}-build${BUILD}.apk"
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk "downloads/${APK_NAME}"
          sha256sum "downloads/${APK_NAME}" > "downloads/${APK_NAME}.sha256"
          python - <<'PY'
          import hashlib, json, pathlib
          meta=json.load(open('version.json',encoding='utf-8'))
          apk_name=f"X-Stage-Karaoke-Android-v{meta['version']}-build{meta['build']}.apk"
          apk=pathlib.Path('downloads')/apk_name
          info={
            'name':'X-Stage Karaoke Android Test APK (TV + Tablet)',
            'version':meta['version'],
            'build':meta['build'],
            'file':apk.name,
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'source_commit':'${{ github.sha }}',
            'note':'Android TV/tablet test APK signed with the stable public X-Stage test key for in-place sideload updates; production Google Play signing is separate.'
          }
          pathlib.Path('downloads/android-tv-latest.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved while Android TV build was running; refusing to publish a stale APK"
            exit 1
          fi
          git add "downloads/${APK_NAME}" "downloads/${APK_NAME}.sha256" downloads/android-tv-latest.json
          if git diff --cached --quiet; then
            echo "Published APK is unchanged"
            exit 0
          fi
          git commit -m "build(android-tv): publish browser-downloadable test APK"
          git push origin HEAD:main
