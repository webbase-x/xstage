name: X-Stage cloud folder import real Chromium E2E
on:
  push:
    branches: [main]
    paths:
      - "cloud-import*.js"
      - "cloud-drive-folders.js"
      - "scripts/cloud-drive-folders-test.mjs"
      - "scripts/karaoke-drive-media-sources-test.mjs"
      - "pc-extensions.js"
      - "xsk-browser.js"
      - "xmid-browser.js"
      - "scripts/xmid-missing-metadata-test.mjs"
      - "scripts/xsk-browser-test.mjs"
      - "scripts/xsk-queue-test.mjs"
      - "scripts/memory-queue-test.mjs"
      - "scripts/soundfont-memory-test.mjs"
      - "memory-budget.js"
      - "browser-midi.js"
      - "xstage-ux.css"
      - "mobile-layout.js"
      - "scripts/karaoke-bottom-search-browser-e2e.mjs"
      - "scripts/karaoke-responsive-search-test.mjs"
      - "cloud-import*.css"
      - "index.html"
      - "karaoke.html"
      - "app.js"
      - "scripts/cloud-import-test.mjs"
      - "scripts/cloud-import-contract-test.mjs"
      - "scripts/cloud-import-browser-e2e.mjs"
      - "scripts/video-browser-transcode-e2e.mjs"
      - "video-transcode*.js"
      - ".github/workflows/test-cloud-import-browser.yml"
  pull_request:
    paths:
      - "cloud-import*.js"
      - "index.html"
      - "karaoke.html"
      - "app.js"
      - "scripts/cloud-import-test.mjs"
      - "scripts/cloud-import-contract-test.mjs"
      - "scripts/cloud-import-browser-e2e.mjs"
      - ".github/workflows/test-cloud-import-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check standalone importer regressions
        run: |
          node scripts/cloud-import-test.mjs
          node scripts/cloud-import-contract-test.mjs
          node scripts/cloud-drive-folders-test.mjs
          node scripts/karaoke-drive-media-sources-test.mjs
          node scripts/xmid-missing-metadata-test.mjs
          node scripts/xsk-browser-test.mjs
          node scripts/xsk-queue-test.mjs
          node scripts/memory-queue-test.mjs
          node scripts/soundfont-memory-test.mjs
          node --check memory-budget.js
          node --check browser-midi.js
          node --check xsk-browser.js
          node --check xmid-browser.js
          node --check cloud-import.js
          node --check cloud-drive-folders.js
      - name: Prepare headless Chromium on CI only
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0 sql.js@1.13.0
          npx playwright install --with-deps chromium
      - name: Verify responsive bottom search in real Chromium viewports
        run: |
          node scripts/karaoke-responsive-search-test.mjs
          node scripts/karaoke-bottom-search-browser-e2e.mjs
      - name: Install test-only FFmpeg to generate a real AVI fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Test browser Google Drive private-folder workflow
        run: node scripts/cloud-import-browser-e2e.mjs
      - name: Verify real AVI to H.264/AAC conversion in browser Worker
        run: node scripts/video-browser-transcode-e2e.mjs
