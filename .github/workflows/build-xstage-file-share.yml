name: Build X-Stage File Share APK

on:
  workflow_dispatch:
  push:
    paths:
      - "xstage-file-share/**"
      - "file-share/**"
      - ".github/workflows/build-xstage-file-share.yml"
  pull_request:
    paths:
      - "xstage-file-share/**"
      - "file-share/**"
      - ".github/workflows/build-xstage-file-share.yml"

permissions:
  contents: write

concurrency:
  group: xstage-fileshare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Expand standalone Android source
        run: unzip -oq xstage-file-share/source.zip -d .
      - name: Test LAN transfer and browser scripts
        run: bash xstage-file-share/tests/test-lan.sh
      - name: Build signed preview APK
        run: gradle -p xstage-file-share clean assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature and source
        shell: bash
        run: |
          set -euo pipefail
          APK="xstage-file-share/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t xstage-file-share/source.zip >/dev/null
          mkdir -p release
          cp "$APK" release/X-Stage-File-Share-v0.1.1-preview.4.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
          cp xstage-file-share/source.zip release/X-Stage-File-Share-source.zip
      - name: Upload APK and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: X-Stage-File-Share-Preview
          retention-days: 30
          if-no-files-found: error
          path: release/*
      - name: Publish PUBLIC GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="xstage-file-share-v0.1.1-preview.4"
          printf '%s\n' 'PREVIEW / TEST ONLY. Public, non-production APK signing key. LAN path tested with JVM harness; WebRTC outside-LAN is best-effort, depends on PeerJS Cloud and STUN, requires supported Android WebView, and may fail without a TURN server. No installer can silently update Android without OS approval. See source README.' > release/RELEASE_NOTES.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.apk release/SHA256SUMS.txt release/*-source.zip --clobber
          else
            gh release create "$TAG" release/*.apk release/SHA256SUMS.txt release/*-source.zip --title "X-Stage File Share v0.1.1 Preview" --notes-file release/RELEASE_NOTES.txt --prerelease
          fi
