name: Build X-Stage icon assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-xstage-icons.yml"
      - "scripts/build_xstage_icons.py"
      - "assets/xstage-app-icon.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install "Pillow>=10,<13" "CairoSVG>=2.7,<3"
      - name: Generate X-Stage icons from the stage emblem
        run: python scripts/build_xstage_icons.py
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/xstage-favicon-32.png assets/xstage-app-icon-192.png assets/xstage-app-icon-512.png assets/xstage-app-icon-maskable-512.png assets/xstage-apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "build(icons): update X-Stage icon assets"
            git push
          fi
