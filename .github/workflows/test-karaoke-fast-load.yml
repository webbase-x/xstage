name: Karaoke Online fast-load checks

on:
  push:
    paths:
      - "browser-midi.js"
      - "app.js"
      - "karaoke.html"
      - "scripts/midi-fast-load-test.mjs"
      - ".github/workflows/test-karaoke-fast-load.yml"
  pull_request:
    paths:
      - "browser-midi.js"
      - "app.js"
      - "karaoke.html"
      - "scripts/midi-fast-load-test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: |
          node --check browser-midi.js
          node --check app.js
      - name: Karaoke Online first-song and cache regression
        run: node scripts/midi-fast-load-test.mjs
