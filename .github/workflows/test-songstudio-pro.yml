name: X-Stage Song Studio Pro · Tests and Windows Preview

on:
  pull_request:
    branches: [main]
    paths:
      - "songstudio-plus/**"
      - "scripts/test-songstudio-pro-timeline*.mjs"
      - "scripts/test-songstudio-pro-actions.mjs"
      - "scripts/test_songstudio_pro_exe_smoke.py"
      - "scripts/test_songstudio_pro_popup_smoke.py"
      - "scripts/test_songstudio_pro_ui_matrix.py"
      - "scripts/test-songstudio-pro-portal.mjs"
      - ".github/workflows/test-songstudio-pro.yml"
      - ".github/workflows/publish-songstudio-pro-v0142.yml"
  push:
    branches: [main]
    paths:
      - "songstudio-plus/**"
      - "scripts/test-songstudio-pro-timeline*.mjs"
      - "scripts/test-songstudio-pro-actions.mjs"
      - "scripts/test-songstudio-pro-portal.mjs"
      - "scripts/test-songstudio-pro-native-picker.py"
      - "scripts/test_songstudio_pro_popup_smoke.py"
      - "scripts/test_songstudio_pro_ui_matrix.py"
      - ".github/workflows/test-songstudio-pro.yml"
      - ".github/workflows/publish-songstudio-pro-v0142.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xstage-songstudio-pro-main
  cancel-in-progress: true

jobs:
  core-and-web:
    name: SQLite, NCN, X-media and UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile standalone app
        run: python -m compileall -q songstudio-plus
      - name: Verify v0.1.42 updater and installer agree
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "songstudio-plus")
          import pro_updater
          version=pro_updater.VERSION
          installer=Path("songstudio-plus/installer/XStageSongStudioPro.iss").read_text(encoding="utf-8")
          workflow=Path(".github/workflows/test-songstudio-pro.yml").read_text(encoding="utf-8")
          assert version=="0.1.42"
          assert f'#define MyAppVersion "{version}"' in installer
          assert f"X-Stage-Song-Studio-Pro-v{version}-win-x64-Setup.exe" in workflow
          source=Path("songstudio-plus/pro_updater.py").read_text(encoding="utf-8")
          assert "remainingPids" in source and "$n -lt 60" in source
          print("PASS: updater, installer, CI version and process-exit safeguards")
          PY
      - name: Test SHA-256, NCN, versioned lyrics, undo and embedded file
        run: python -m unittest discover -s songstudio-plus/tests -p "test_*.py" -v
      - name: Ensure manual lyric editor and build scope controls are wired
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("songstudio-plus/web/index.html").read_text(encoding="utf-8")
          js=Path("songstudio-plus/web/app.js").read_text(encoding="utf-8")
          backend=Path("songstudio-plus/manual_editor.py").read_text(encoding="utf-8")
          for needle in ("view-manual","manual-save","manual-skip","manual-approve",
                         "manual-mark-cue","manual-toggle-menu","manual-toggle-queue",
                         "manual-toggle-stage","manual-focus","manual-diagnostic-list",
                         "manual-diagnostic-summary","manual-only-issues",
                         "manual-edit-scroll","manual-timeline-track",
                         "manual-timeline-ruler","manual-timeline-playhead",
                         "manual-timeline-cues","manual-timeline-zoom-in",
                         "manual-timeline-zoom-out","manual-timeline-follow",
                         "build-page-all","build-page-clear",
                         "build-all","build-clear"):
              assert needle in html, needle
          for needle in ("loadManualQueue()","manualSave()","manualSkip()",
                         "manualApprove()","manualRenderFindings()","manualFocusLine(",
                         "manualApplyLayout()","manualCheckDraft(","manualDraftState()",
                         "manual-cue-token","manual-advanced-times",
                         "manualOnlyIssues","XStageCueTimelineUI",
                         "manualTimeline?.render()","allReadySelected",
                         "excludedSongs"):
              assert needle in js, needle
          assert "xstage_manual_reviews" in backend
          print("PASS: manual lyric editor and global/page selection UI contracts")
          PY
      - name: JavaScript syntax check
        run: |
          node --check songstudio-plus/web/app.js
          node --check songstudio-plus/web/timeline-core.js
          node --check songstudio-plus/web/timeline-ui.js
          node scripts/test-songstudio-pro-timeline.mjs
          node scripts/test-songstudio-pro-timeline-ui.mjs
          node --check storefront.js
          node scripts/test-songstudio-pro-portal.mjs
          node scripts/test-songstudio-pro-actions.mjs
      - name: Static app and security surface contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,"songstudio-plus")
          import app
          assert app.Handler.server_version.startswith("XStageSongStudioPro")
          page=Path("songstudio-plus/web/index.html").read_text(encoding="utf-8")
          for token in ['data-view="import"','data-view="drive"','data-view="lyrics"','data-view="media"','data-view="preview"','data-view="manual"','data-view="build"','data-view="library"','data-view="risks"']:
              assert token in page,token
          assert 'class="build-selection-internal" hidden aria-hidden="true"' in page
          assert '<span class="label-top">CHOOSE SONGS</span>' not in page
          assert "Lyrics JSON" not in page
          assert ".xsk" not in page.lower()
          print("PASS: nine-menu standalone app with Google Drive import and pre-export preview")
          PY

  windows-installer:
    name: Build Program Files Windows Setup (preview)
    needs: core-and-web
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install isolated EXE builder
        run: python -m pip install "pyinstaller>=6,<7" "pillow>=11,<13" "PySide6>=6.8,<7"
      - name: Test Windows-native picker backend with Thai Unicode paths
        shell: pwsh
        run: |
          python songstudio-plus/tests/test_windows_picker.py
          if ($LASTEXITCODE -ne 0) { throw "Windows picker backend regression failed" }
      - name: Validate desktop standalone contract
        shell: pwsh
        run: |
          node scripts/test-songstudio-pro-actions.mjs
          if ($LASTEXITCODE -ne 0) { throw "Desktop standalone contract failed" }
          python scripts/test_songstudio_pro_popup_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Qt WebEngine popup smoke failed" }
          python scripts/test_songstudio_pro_ui_matrix.py
          if ($LASTEXITCODE -ne 0) { throw "Qt all-menu responsive smoke failed" }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: X-Stage-Song-Studio-Pro-Qt-Viewport-Evidence
          path: dist/songstudio-viewport-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Build stable-name desktop app payload
        shell: pwsh
        run: |
          python songstudio-plus/make_icon.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed --icon "songstudio-plus/app-plus.ico" --name "XStageSongStudioPro" --paths "songstudio-plus" --add-data "songstudio-plus/web;web" --add-data "songstudio-plus/app-plus.ico;." --hidden-import "PySide6.QtWebEngineWidgets" --hidden-import "PySide6.QtWebEngineCore" --hidden-import "windows_picker" songstudio-plus/app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (!(Test-Path "dist/XStageSongStudioPro/XStageSongStudioPro.exe")) { throw "App payload missing" }
          if (!(Test-Path "dist/XStageSongStudioPro/_internal/python313.dll")) { throw "Bundled CPython 3.13 runtime missing" }
          if (!(Test-Path "dist/XStageSongStudioPro/_internal/PySide6")) { throw "Bundled Qt runtime missing" }
          python scripts/verify_songstudio_exe_icon.py "dist/XStageSongStudioPro/XStageSongStudioPro.exe"
          if ($LASTEXITCODE -ne 0) { throw "EXE icon verification failed" }
      - name: Smoke-test the actual Windows EXE and embedded Qt WebView
        shell: pwsh
        run: |
          python scripts/test_songstudio_pro_exe_smoke.py "dist/XStageSongStudioPro/XStageSongStudioPro.exe"
          if ($LASTEXITCODE -ne 0) { throw "Packaged EXE Qt WebView smoke test failed" }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: X-Stage-Song-Studio-Pro-EXE-Smoke-Evidence
          path: |
            dist/pro-exe-smoke/exe-smoke-result.json
            dist/pro-exe-smoke/LOGS/song-studio-pro.log
          retention-days: 14
          if-no-files-found: warn
      - name: Install Inno Setup and build Setup EXE
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { $compiler = Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe' }
          if (!(Test-Path $compiler)) { throw "ISCC.exe missing" }
          & $compiler 'songstudio-plus/installer/XStageSongStudioPro.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (!(Test-Path "songstudio-plus/installer/output/X-Stage-Song-Studio-Pro-v0.1.42-win-x64-Setup.exe")) { throw "Setup EXE missing" }
      - name: Verify Setup SHA-256 and create evidence
        shell: pwsh
        run: |
          $setup="songstudio-plus/installer/output/X-Stage-Song-Studio-Pro-v0.1.42-win-x64-Setup.exe"
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "X-Stage Song Studio Pro v0.1.42 Windows x64 Program Files Setup" | Out-File "dist/README-Setup.txt" -Encoding UTF8
          "SHA-256: $hash" | Out-File "dist/README-Setup.txt" -Encoding UTF8 -Append
          "Inno Setup (unsigned); requires Windows UAC, retains user SQLite workspace." | Out-File "dist/README-Setup.txt" -Encoding UTF8 -Append
          Write-Host "SETUP SHA-256 $hash"
      - uses: actions/upload-artifact@v6
        with:
          name: X-Stage-Song-Studio-Pro-v0.1.42-Windows-Setup
          path: songstudio-plus/installer/output/X-Stage-Song-Studio-Pro-v0.1.42-win-x64-Setup.exe
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: X-Stage-Song-Studio-Pro-v0.1.42-Windows-Setup-Metadata
          path: dist/README-Setup.txt
          retention-days: 14
          if-no-files-found: error
