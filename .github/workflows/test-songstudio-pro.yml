name: X-Stage Song Studio Pro · Tests and Windows Preview

on:
  push:
    branches: [main]
    paths:
      - "songstudio-plus/**"
      - "scripts/test-songstudio-pro-timeline*.mjs"
      - "scripts/test-songstudio-pro-actions.mjs"
      - "scripts/test-songstudio-pro-portal.mjs"
      - "scripts/test-songstudio-pro-native-picker.py"
      - ".github/workflows/test-songstudio-pro.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xstage-songstudio-pro-main
  cancel-in-progress: true

jobs:
  core-and-web:
    name: SQLite, NCN, X-media and UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile standalone app
        run: python -m compileall -q songstudio-plus
      - name: Test SHA-256, NCN, versioned lyrics, undo and embedded file
        run: python -m unittest discover -s songstudio-plus/tests -p "test_*.py" -v
      - name: Ensure manual lyric editor and build scope controls are wired
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("songstudio-plus/web/index.html").read_text(encoding="utf-8")
          js=Path("songstudio-plus/web/app.js").read_text(encoding="utf-8")
          backend=Path("songstudio-plus/manual_editor.py").read_text(encoding="utf-8")
          for needle in ("view-manual","manual-save","manual-skip","manual-approve",
                         "manual-mark-cue","manual-toggle-menu","manual-toggle-queue",
                         "manual-toggle-stage","manual-focus","manual-diagnostic-list",
                         "manual-diagnostic-summary","manual-only-issues",
                         "manual-edit-scroll","manual-timeline-track",
                         "manual-timeline-ruler","manual-timeline-playhead",
                         "manual-timeline-cues","manual-timeline-zoom-in",
                         "manual-timeline-zoom-out","manual-timeline-follow",
                         "build-page-all","build-page-clear",
                         "build-all","build-clear"):
              assert needle in html, needle
          for needle in ("loadManualQueue()","manualSave()","manualSkip()",
                         "manualApprove()","manualRenderFindings()","manualFocusLine(",
                         "manualApplyLayout()","manualCheckDraft(","manualDraftState()",
                         "manual-cue-token","manual-advanced-times",
                         "manualOnlyIssues","XStageCueTimelineUI",
                         "manualTimeline?.render()","allReadySelected",
                         "excludedSongs"):
              assert needle in js, needle
          assert "xstage_manual_reviews" in backend
          print("PASS: manual lyric editor and global/page selection UI contracts")
          PY
      - name: JavaScript syntax check
        run: |
          node --check songstudio-plus/web/app.js
          node --check songstudio-plus/web/timeline-core.js
          node --check songstudio-plus/web/timeline-ui.js
          node scripts/test-songstudio-pro-timeline.mjs
          node scripts/test-songstudio-pro-timeline-ui.mjs
          node --check storefront.js
          node scripts/test-songstudio-pro-portal.mjs
          node scripts/test-songstudio-pro-actions.mjs
      - name: Static app and security surface contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,"songstudio-plus")
          import app
          assert app.Handler.server_version.startswith("XStageSongStudioPro")
          page=Path("songstudio-plus/web/index.html").read_text(encoding="utf-8")
          for token in ['data-view="import"','data-view="lyrics"','data-view="media"','data-view="preview"','data-view="manual"','data-view="build"','data-view="library"','data-view="risks"']:
              assert token in page,token
          assert "Lyrics JSON" not in page
          assert ".xsk" not in page.lower()
          print("PASS: eight-menu standalone app with manual lyric repair and pre-export preview")
          PY

  windows-preview:
    name: Build portable Windows EXE (preview only)
    needs: core-and-web
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install isolated EXE builder
        run: python -m pip install "pyinstaller>=6,<7" "pillow>=11,<13" "PySide6>=6.8,<7"
      - name: Test Windows-native picker backend with Thai Unicode paths
        shell: pwsh
        run: |
          python songstudio-plus/tests/test_windows_picker.py
          if ($LASTEXITCODE -ne 0) { throw "Windows picker backend regression failed" }
      - name: Validate desktop standalone contract
        shell: pwsh
        run: |
          node scripts/test-songstudio-pro-actions.mjs
          if ($LASTEXITCODE -ne 0) { throw "Desktop standalone contract failed" }
      - name: Build standalone EXE with embedded web frontend
        shell: pwsh
        run: |
          python songstudio-plus/make_icon.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon "songstudio-plus/app-plus.ico" --name "X-Stage-Song-Studio-Pro-v0.1.28-preview" --paths "songstudio-plus" --add-data "songstudio-plus/web;web" --add-data "songstudio-plus/app-plus.ico;." --hidden-import "PySide6.QtWebEngineWidgets" --hidden-import "PySide6.QtWebEngineCore" --hidden-import "windows_picker" songstudio-plus/app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller returned failure" }
          if (!(Test-Path "dist/X-Stage-Song-Studio-Pro-v0.1.28-preview.exe")) { throw "EXE not produced" }
          python scripts/verify_songstudio_exe_icon.py "dist/X-Stage-Song-Studio-Pro-v0.1.28-preview.exe"
          if ($LASTEXITCODE -ne 0) { throw "Song Studio EXE missing its branded Windows icon" }
      - name: Verify EXE hash and package preview
        shell: pwsh
        run: |
          $exe="dist/X-Stage-Song-Studio-Pro-v0.1.28-preview.exe"
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "X-Stage Song Studio Pro v0.1.28 Desktop Standalone Preview" | Out-File "dist/README-Preview.txt" -Encoding UTF8
          "SHA-256: $hash" | Out-File "dist/README-Preview.txt" -Encoding UTF8 -Append
          "Desktop Standalone using PySide6 QtWebEngine with local-only SQLite Engine. Checks verified updates immediately after engine connect, shows an in-app update notice with one-click install, and retains responsive API/SQLite safeguards. Binary not code-signed." | Out-File "dist/README-Preview.txt" -Encoding UTF8 -Append
          Write-Host "EXE SHA-256 $hash"
      - uses: actions/upload-artifact@v6
        with:
          name: X-Stage-Song-Studio-Pro-v0.1.28-Windows-Preview
          path: dist/X-Stage-Song-Studio-Pro-v0.1.28-preview.exe
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: X-Stage-Song-Studio-Pro-v0.1.28-Windows-Preview-Metadata
          path: dist/README-Preview.txt
          retention-days: 14
          if-no-files-found: error
