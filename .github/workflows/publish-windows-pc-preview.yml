name: Publish X-Stage Karaoke PC Windows binary preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-windows-pc-preview.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: xstage-windows-preview
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "44006131078"
      SOURCE_SHA: "6acb5dc5aff73c7e0ccbc1f02be8571346cc0032"
      TAG: "xstage-karaoke-pc-preview-v1.0.78-build1078"
      INSTALLER: "X-Stage-Karaoke-PC-Windows-v1.0.78-build1078.exe"
    steps:
      - uses: actions/checkout@v4
      - name: Check exact successful Windows source/build provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('windows-pc/manifest.json',encoding='utf8'))
          assert d['source_imported'] and d['version']=='1.0.78' and d['build']==1078
          PY
          verified=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha --jq '[.conclusion,.headSha]|join(" ")')
          test "$verified" = "success $SOURCE_SHA" || { echo "::error::Original candidate run was not successful"; exit 1; }
          changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...$GITHUB_SHA" --jq '.files[].filename')
          if printf '%s\n' "$changed" | grep -Eq '^(windows-pc/|scripts/build_karaoke_pc_icon.py$|.github/workflows/build-windows-pc.yml$)'; then
            echo "::error::Windows sources have changed since the passing build"
            exit 1
          fi

      - name: Extract only verified public EXE (no source ZIP)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "X-Stage-Karaoke-PC-Windows-v1.0.78-build1078-CANDIDATE" --dir dist
          exe=$(find dist -type f -name "$INSTALLER" -print -quit)
          check=$(find dist -type f -name "$INSTALLER.sha256" -print -quit)
          test -n "$exe" && test -n "$check"
          test "$(stat -c %s "$exe")" -gt 1000000
          expected=$(head -c 64 "$check" | tr '[:upper:]' '[:lower:]')
          actual=$(sha256sum "$exe" | cut -d ' ' -f1)
          test "$expected" = "$actual" || { echo "::error::Installer SHA-256 mismatch"; exit 1; }
          test "$(head -c 2 "$exe")" = "MZ" || { echo "::error::Not a Windows executable"; exit 1; }
          cp "$exe" "dist/verified-$INSTALLER"
          mv "dist/verified-$INSTALLER" "dist/$INSTALLER"
          printf '%s  %s\n' "$actual" "$INSTALLER" > "dist/$INSTALLER.sha256"

      - name: Publish public PREVIEW only
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$INSTALLER"
          else
            gh release create "$TAG" "dist/$INSTALLER" "dist/$INSTALLER.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease \
              --title "X-Stage Karaoke PC 1.0.78 (1078) Windows PREVIEW" \
              --notes "Binary-only Windows preview verified by CI and SHA-256. NOT code-signed, NOT manually qualified for every Windows configuration; SmartScreen may warn. No source-only ZIP distributed by this release."
          fi

      - name: Enable preview download feed after release exists
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cut -d ' ' -f1 "dist/$INSTALLER.sha256")
          export HASH
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -C main origin/main
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          name=os.environ['INSTALLER']
          data={
            'channel':'preview','available':True,
            'name':'X-Stage Karaoke PC Windows PREVIEW',
            'platform':'windows-x64','version':'1.0.78','build':1078,
            'installer_file':name,'sha256':os.environ['HASH'],
            'download_url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/'+os.environ['TAG']+'/'+name,
            'source_commit':os.environ['SOURCE_SHA'],
            'note':'Unsigned preview installer, CI verified with SHA-256. Windows SmartScreen may show a warning. Not an official signed update.'
          }
          Path('downloads/windows-pc-preview-latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          PY
          git add downloads/windows-pc-preview-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(windows): publish preview binary metadata [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
          done
