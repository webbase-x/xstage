name: Karaoke Online canonical Google Drive layout

on:
  push:
    paths:
      - "app.js"
      - "config.js"
      - "cloud-import.js"
      - "cloud-drive-folders.js"
      - "browser-midi.js"
      - "scripts/cloud-drive-folders-test.mjs"
      - "scripts/karaoke-drive-media-sources-test.mjs"
      - "scripts/google-picker-dialog-layer-test.mjs"
      - "pc-extensions.js"
      - "browser-midi.js"
      - "karaoke.html"
      - "version.json"
      - "scripts/karaoke-drive-layout-test.mjs"
      - "scripts/cloud-import-test.mjs"
      - "scripts/cloud-import-contract-test.mjs"
      - "scripts/drive-list-pagination-test.mjs"
      - ".github/workflows/test-karaoke-drive-layout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drive-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate browser JavaScript syntax
        run: |
          node --check app.js
          node --check cloud-import.js
          node --check cloud-drive-folders.js
          node --check browser-midi.js
      - name: Verify canonical new root, file formats, DB pointer and upload safety
        run: |
          node scripts/karaoke-drive-layout-test.mjs
          node scripts/drive-list-pagination-test.mjs
          node scripts/cloud-import-test.mjs
          node scripts/cloud-import-contract-test.mjs
          node scripts/cloud-drive-folders-test.mjs
          node scripts/karaoke-drive-media-sources-test.mjs
          node scripts/google-picker-dialog-layer-test.mjs
