name: Publish X-Stage Download Manager verified EXE

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.XSTAGE_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish previously built EXE and verify SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.XSTAGE_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'X-Stage-Download-Manager-v0.2.0-build3-win-x64-Setup.exe'
          $tag = 'xstage-download-manager-v0.2.0-build3-preview'
          $expected = '2127abacdae7043773b775e3fbd78067eee72d92b79588b1d8c0b36efaa376ed'
          $out = Join-Path $env:RUNNER_TEMP 'verified-exe'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          gh run download 44530156524 --repo $env:GITHUB_REPOSITORY --name 'X-Stage-Download-Manager-v0.2.0-build3-Windows-EXE-ONLY' --dir $out
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download the existing Windows EXE build artifact' }
          $matches = @(Get-ChildItem -Path $out -File -Recurse -Filter $name)
          if ($matches.Count -ne 1) { throw "Expected exactly one Setup EXE: $($matches.Count)" }
          $file = $matches[0].FullName
          if ((Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant() -cne $expected) { throw 'The prebuilt EXE does not match the verified SHA-256' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            $notes = "One Setup EXE only. Windows x64 Preview v0.2.0 Build 3 with bundled yt-dlp, FFmpeg and Deno. Public authorized video links and original HTTP file downloads; no DRM bypass. Unsigned preview. SHA256 $expected"
            gh release create $tag $file --repo $env:GITHUB_REPOSITORY --target a3b0e1ef93e41ec614208b6e50758b235e853ee7 --title 'X-Stage Download Manager v0.2.0 Build 3 (Preview)' --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Release blocked by GitHub permissions. Enable Read and write in repository Settings > Actions > General or add XSTAGE_RELEASE_TOKEN with Contents read/write.' }
          }
          $check = Join-Path $env:RUNNER_TEMP 'release-check'
          New-Item -ItemType Directory -Force -Path $check | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $name --dir $check
          if ($LASTEXITCODE -ne 0) { throw 'Published EXE download failed' }
          $published = Join-Path $check $name
          if ((Get-FileHash -Algorithm SHA256 $published).Hash.ToLowerInvariant() -cne $expected) { throw 'Published EXE SHA-256 mismatch' }
          $size = (Get-Item $published).Length
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$name"
          $manifest = [ordered]@{name='X-Stage Download Manager';version='0.2.0';build=3;channel='preview';available=$true;file=$name;sha256=$expected;size_bytes=$size;download_url=$url;note='Verified single Windows Setup EXE with bundled video tools; unsigned Preview.'}
          $manifest | ConvertTo-Json -Depth 4 | Set-Content 'downloads/download-manager-preview-latest.json' -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- downloads/download-manager-preview-latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'release(download-manager): verified public EXE-only Build 3 feed [skip ci]'
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit release manifest' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Release published but X-Stage portal could not be updated' }
          }
          Write-Host "VERIFIED PUBLIC EXE $url SHA256 $expected"
