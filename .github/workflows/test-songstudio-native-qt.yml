name: Song Studio native Qt desktop regression

on:
  push:
    branches:
      - feature/songstudio-native-qt-desktop-360
  pull_request:
    paths:
      - "songstudio-pc/**"
      - "scripts/build_songstudio_ready.ps1"
      - "scripts/test_songstudio_native_desktop.py"

permissions:
  contents: read

jobs:
  native-qt-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Validate Python source and native launcher
        shell: pwsh
        run: |
          python -m compileall -q songstudio-pc scripts
          if ($LASTEXITCODE -ne 0) { throw "Syntax validation failed" }
          python -m unittest discover -s scripts -p test_songstudio_native_desktop.py -v
          if ($LASTEXITCODE -ne 0) { throw "Native desktop contract failed" }
      - name: Verify Windows QtWebEngine wheels and imports
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: PySide6==6.9.3
          if ($LASTEXITCODE -ne 0) { throw "Qt installation failed" }
          python -c "from PySide6.QtWebEngineWidgets import QWebEngineView; from PySide6.QtWebEngineCore import QWebEngineProfile; print('QT_WEBENGINE_OK')"
          if ($LASTEXITCODE -ne 0) { throw "QtWebEngine import failed" }

  complete-ready-zip:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build offline PC Ready ZIP with embedded Qt
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0 cryptography==46.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Build tooling unavailable' }
          & ./scripts/build_songstudio_ready.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native Qt PC Ready ZIP failed to build' }
      - name: Validate offline conversions
        shell: powershell
        run: |
          $bundle = 'dist/X-Stage-Song-Studio-PC-Ready-v0.3.60-build360'
          & (Join-Path $bundle '.runtime/python/python.exe') scripts/test_songstudio_ready.py $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Offline Ready runtime conversion regression failed' }
      - name: Upload candidate ZIP for review
        uses: actions/upload-artifact@v6
        with:
          name: SongStudio-PC-Native-Qt-v0.3.60-build360-CANDIDATE
          path: |
            dist/X-Stage-Song-Studio-PC-Ready-v0.3.60-build360.zip
            dist/X-Stage-Song-Studio-PC-Ready-v0.3.60-build360.zip.sha256
          retention-days: 7
