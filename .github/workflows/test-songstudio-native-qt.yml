name: Song Studio native Qt desktop regression

on:
  push:
    branches:
      - feature/songstudio-native-qt-desktop-360
      - feature/songstudio-fast-json-workflows-361
      - feature/songstudio-duplicate-media-362
      - feature/songstudio-duplicate-bundles-363
  pull_request:
    paths:
      - "songstudio-pc/**"
      - "scripts/build_songstudio_ready.ps1"
      - "scripts/test_songstudio_native_desktop.py"
      - "scripts/test_songstudio_json_source_stream.py"
      - "scripts/test_songstudio_duplicates.py"

permissions:
  contents: read

# Cancel superseded ~650 MB Windows builds on this development branch.
concurrency:
  group: songstudio-native-qt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-qt-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Validate Python source and native launcher
        shell: pwsh
        run: |
          python -m compileall -q songstudio-pc scripts
          if ($LASTEXITCODE -ne 0) { throw "Syntax validation failed" }
          python -m unittest discover -s scripts -p test_songstudio_pc_export.py -v
          if ($LASTEXITCODE -ne 0) { throw "PC catalog export regression failed" }
          python -m unittest discover -s scripts -p test_songstudio_json_pro.py -v
          if ($LASTEXITCODE -ne 0) { throw "JSON Pro media/transcode/resume regression failed" }
          node --check studio/app.js
          if ($LASTEXITCODE -ne 0) { throw "Song Studio UI JavaScript syntax failed" }
          node scripts/test_songstudio_ui_contract.mjs
          if ($LASTEXITCODE -ne 0) { throw "Song Studio UI navigation/action contract failed" }
          python -m unittest discover -s scripts -p test_songstudio_duplicates.py -v
          if ($LASTEXITCODE -ne 0) { throw "Media dedup scanner/regression failed" }
          python -m unittest discover -s scripts -p test_songstudio_json_source_stream.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Incremental JSON source regression failed' }
          python -m unittest discover -s scripts -p test_songstudio_native_desktop.py -v
          if ($LASTEXITCODE -ne 0) { throw "Native desktop contract failed" }
      - name: Verify Windows QtWebEngine wheels and imports
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: PySide6==6.9.3
          if ($LASTEXITCODE -ne 0) { throw "Qt installation failed" }
          python -c "from PySide6.QtWebEngineWidgets import QWebEngineView; from PySide6.QtWebEngineCore import QWebEngineProfile; print('QT_WEBENGINE_OK')"
          if ($LASTEXITCODE -ne 0) { throw "QtWebEngine import failed" }

  complete-ready-zip:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build offline PC Ready ZIP with embedded Qt
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0 cryptography==46.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Build tooling unavailable' }
          & ./scripts/build_songstudio_ready.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native Qt PC Ready ZIP failed to build' }
      - name: Validate offline conversions
        shell: powershell
        run: |
          $bundle = 'dist/X-Stage-Song-Studio-PC-Ready-v0.3.64-build364'
          & (Join-Path $bundle '.runtime/python/python.exe') scripts/test_songstudio_ready.py $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Offline Ready runtime conversion regression failed' }
      - name: Exercise real bundled Qt desktop startup (offscreen CI)
        shell: powershell
        run: |
          $bundle = 'dist/X-Stage-Song-Studio-PC-Ready-v0.3.64-build364'
          python scripts/test_songstudio_native_runtime.py $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native Qt Engine startup failed' }
      - name: Upload candidate ZIP for review
        uses: actions/upload-artifact@v6
        with:
          name: SongStudio-PC-Native-Qt-v0.3.64-build364-CANDIDATE
          path: |
            dist/X-Stage-Song-Studio-PC-Ready-v0.3.64-build364.zip
            dist/X-Stage-Song-Studio-PC-Ready-v0.3.64-build364.zip.sha256
          retention-days: 7
