name: Mirror TV legacy direct APK publisher (superseded)

# Archived entry point. Since v0.2.4 every successful Mirror TV build publishes
# the verified test APK, corresponding GPLv3 source, and direct X-Stage download
# in one transaction. Never re-publish old v0.2.3 metadata over a newer build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Explain current release workflow
        run: |
          echo "Mirror TV direct APK files are now published by build-xstage-mirror-tv.yml."
          echo "This retired task does not alter binaries or manifests."
