name: Build X-Stage Download Manager Windows Preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'download-manager/**'
      - '.github/workflows/build-xstage-download-manager.yml'

permissions:
  contents: write

concurrency:
  group: xstage-download-manager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test actual HTTP Range resume and fallback
        shell: pwsh
        run: |
          dotnet run --project download-manager/tests/DownloadEngine.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'DownloadEngine integration tests failed' }
      - name: Validate X-Stage portal contract
        shell: pwsh
        run: |
          node download-manager/tests/portal-contract.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Portal contract test failed' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate X-Stage app icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install Pillow' }
          python download-manager/generate_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon creation failed' }
          if (-not (Test-Path download-manager/app.ico)) { throw 'Windows ICO missing' }
      - name: Build Windows x64 self-contained EXE
        shell: pwsh
        run: |
          dotnet publish download-manager/XStageDownloadManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o download-manager/out
          if ($LASTEXITCODE -ne 0) { throw 'Download Manager build failed' }
          if (-not (Test-Path download-manager/out/XStageDownloadManager.exe)) { throw 'Windows EXE missing' }
          python download-manager/verify_exe_icon.py download-manager/out/XStageDownloadManager.exe
          if ($LASTEXITCODE -ne 0) { throw 'EXE must contain its application icon' }
      - name: Bundle pinned yt-dlp, Deno, and FFmpeg without runtime installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $tools = 'download-manager/out/tools'
          $staging = Join-Path $env:RUNNER_TEMP 'xstage-media-dependencies'
          New-Item -ItemType Directory -Force -Path $tools, $staging | Out-Null
          $packages = @(
            @{
              Key='ytdlp'; Filename='yt-dlp.exe'
              Url='https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.exe'
              Sha256='f5389d3698ecde4ef06f4e6b1ce0294fe9ac1396228c8990b8d3416d6d177a7d'
            },
            @{
              Key='deno'; Filename='deno-windows-x64.zip'
              Url='https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-pc-windows-msvc.zip'
              Sha256='cba84b26e0df5ae7f74fc66b86a95b866872a86292ebd84fa1e959927edd93bf'
            },
            @{
              Key='ffmpeg'; Filename='ffmpeg-windows-x64.zip'
              Url='https://github.com/yt-dlp/FFmpeg-Builds/releases/download/autobuild-2026-11-16-23-35/ffmpeg-N-128970-g11337618b2-win64-gpl.zip'
              Sha256='66789a599f9b6606036f29980ee054abe75201f18a24ca24c623a78c9be3f7c0'
            }
          )
          foreach ($item in $packages) {
            $dest = Join-Path $staging $item.Filename
            Write-Host "Fetching pinned official dependency $($item.Key)"
            Invoke-WebRequest -Uri $item.Url -OutFile $dest -MaximumRedirection 6
            if (-not (Test-Path $dest)) { throw "Download failed for $($item.Key)" }
            $actual = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLowerInvariant()
            if ($actual -cne $item.Sha256) {
              throw "Supply chain SHA-256 verification failed for $($item.Key). Expected $($item.Sha256), got $actual"
            }
            if ($item.Key -eq 'ytdlp') {
              Copy-Item $dest (Join-Path $tools 'yt-dlp.exe')
            } else {
              $expanded = Join-Path $staging ('extracted-' + $item.Key)
              Expand-Archive -Path $dest -DestinationPath $expanded -Force
              foreach ($exe in @($(if ($item.Key -eq 'deno') { 'deno.exe' } else { 'ffmpeg.exe'; 'ffprobe.exe' }))) {
                $source = Get-ChildItem -Path $expanded -File -Recurse -Filter $exe | Select-Object -First 1
                if (-not $source) { throw "$exe missing from pinned $($item.Key) archive" }
                Copy-Item $source.FullName (Join-Path $tools $exe)
              }
            }
          }
          @'
          X-Stage Download Manager third-party notices

          yt-dlp 2026.10.26 | Unlicense | https://github.com/yt-dlp/yt-dlp/tree/2026.10.26
          Deno 2.9.8 | MIT | https://github.com/denoland/deno/tree/v2.9.8
          FFmpeg N-128970-g11337618b2 | GPL build supplied by yt-dlp/FFmpeg-Builds
          FFmpeg build scripts, matching source revision and notices:
          https://github.com/yt-dlp/FFmpeg-Builds/tree/autobuild-2026-11-16-23-35
          https://github.com/FFmpeg/FFmpeg/tree/11337618b2
          https://www.gnu.org/licenses/gpl-3.0.html

          These are separate, independently maintained subprocess executables.
          The user is responsible for rights and website terms when downloading media.
          No DRM circumvention or extraction of private/paid content is provided.
          '@ | Set-Content -Path (Join-Path $tools 'THIRD-PARTY-NOTICES.txt') -Encoding UTF8
          $licenseDir = Join-Path $tools 'licenses'
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          $licenses = @(
            @{ Filename='yt-dlp-UNLICENSE.txt'; Url='https://raw.githubusercontent.com/yt-dlp/yt-dlp/2026.10.26/LICENSE' },
            @{ Filename='Deno-MIT.txt'; Url='https://raw.githubusercontent.com/denoland/deno/v2.9.8/LICENSE.md' },
            @{ Filename='FFmpeg-GPLv3.txt'; Url='https://raw.githubusercontent.com/FFmpeg/FFmpeg/11337618b2/COPYING.GPLv3' }
          )
          foreach ($license in $licenses) {
            $dest = Join-Path $licenseDir $license.Filename
            Invoke-WebRequest -Uri $license.Url -OutFile $dest
            if (-not (Test-Path $dest) -or (Get-Item $dest).Length -lt 500) {
              throw "Required license text missing: $($license.Filename)"
            }
          }
          foreach ($exe in @('yt-dlp.exe','deno.exe','ffmpeg.exe','ffprobe.exe')) {
            if (-not (Test-Path (Join-Path $tools $exe) -PathType Leaf)) { throw "$exe missing in portable installer payload" }
          }
          & (Join-Path $tools 'yt-dlp.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'yt-dlp smoke test failed' }
          & (Join-Path $tools 'deno.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Deno smoke test failed' }
          & (Join-Path $tools 'ffmpeg.exe') -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled ffmpeg smoke test failed' }
          Write-Host 'Bundled verified video tools; no dependencies will be downloaded when the user installs.'
      - name: Validate and bundle optional Chrome/Edge extension
        shell: pwsh
        run: |
          node --check download-manager/browser-extension/background.js
          node --check download-manager/browser-extension/popup.js
          node -e "const m=require('./download-manager/browser-extension/manifest.json'); if (m.manifest_version!==3 || !m.permissions.includes('nativeMessaging')) process.exit(1)"
          Copy-Item -Path download-manager/browser-extension -Destination download-manager/out/browser-extension -Recurse -Force
          if (-not (Test-Path download-manager/out/browser-extension/manifest.json)) { throw 'Browser extension missing in Setup payload' }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Package and verify installer EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup 6 missing' }
          & $compiler download-manager/installer/XStageDownloadManager.iss
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }
          $setup = 'download-manager/installer/output/X-Stage-Download-Manager-v0.2.3-build6-win-x64-Setup.exe'
          if (-not (Test-Path $setup -PathType Leaf)) { throw 'Setup EXE missing' }
          if ((Get-Item $setup).Length -lt 1000000) { throw 'Installer suspiciously small' }
          python scripts/verify_songstudio_exe_icon.py $setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup EXE missing embedded application icon' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($hash -notmatch '^[a-f0-9]{64}$') { throw 'Invalid installer checksum' }
          Write-Host "Installer EXE SHA-256: $hash"
      - name: Upload Windows installer EXE only
        uses: actions/upload-artifact@v4
        with:
          name: X-Stage-Download-Manager-v0.2.3-build6-Windows-EXE-ONLY
          path: download-manager/installer/output/X-Stage-Download-Manager-v0.2.3-build6-win-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified EXE-only GitHub prerelease
        id: release
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.XSTAGE_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'xstage-download-manager-v0.2.3-build6-preview'
          $file = 'X-Stage-Download-Manager-v0.2.3-build6-win-x64-Setup.exe'
          $setup = "download-manager/installer/output/$file"
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          $size = (Get-Item $setup).Length
          # Do not silently replace an existing immutable version with different bytes.
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw 'Release tag already exists: bump the application version before republishing.'
          }
          $notes = "Windows 10/11 x64 Preview. Installer EXE only, with pinned SHA-256 verified yt-dlp, Deno and FFmpeg included. Supports public YouTube, TikTok, Facebook/Instagram Reels, quality selection and MP3, plus original HTTP Range file downloads. No DRM or private content bypass. SHA-256: $hash. Size: $size bytes. Not code-signed or tested on all Windows devices. No browser interception."
          gh release create $tag $setup --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'X-Stage Download Manager v0.2.3 Build 6 (Windows Preview)' --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publish failed' }
          # Download published asset and compare bytes, not just release metadata.
          $verifyDir = Join-Path $env:RUNNER_TEMP 'xstage-release-verify'
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $file --dir $verifyDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve published installer' }
          $published = Join-Path $verifyDir $file
          if (-not (Test-Path $published -PathType Leaf)) { throw 'Published EXE missing' }
          $actual = (Get-FileHash -Algorithm SHA256 $published).Hash.ToLowerInvariant()
          if ($actual -cne $hash) { throw "Published checksum mismatch: $actual vs $hash" }
          Write-Host "VERIFIED PUBLIC EXE $file SHA-256 $hash ($size bytes)"
          Write-Host "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$file"
      - name: Update public download manifest only after release checksum verification
        if: github.ref == 'refs/heads/main' && steps.release.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.2.3'
          $build = 6
          $name = "X-Stage-Download-Manager-v$version-build$build-win-x64-Setup.exe"
          $tag = "xstage-download-manager-v$version-build$build-preview"
          $setup = "download-manager/installer/output/$name"
          if (-not (Test-Path $setup -PathType Leaf)) { throw 'Verified installer missing' }
          $sha = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          $size = (Get-Item $setup).Length
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$name"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch latest portal branch' }
          git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not update portal branch' }
          $manifest = [ordered]@{
            name = 'X-Stage Download Manager'
            version = $version
            build = $build
            channel = 'preview'
            available = $true
            file = $name
            sha256 = $sha
            size_bytes = $size
            download_url = $url
            note = 'Verified Windows Setup EXE with Unicode-path fix, open file/folder choices and bundled yt-dlp/FFmpeg/Deno. Unsigned preview.'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content 'downloads/download-manager-preview-latest.json' -Encoding utf8
          git add -- downloads/download-manager-preview-latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'release(download-manager): verified v0.2.3 Build 6 EXE feed [skip ci]'
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit verified EXE manifest' }
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw 'Could not rebase verified EXE manifest' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Verified EXE published but portal feed push failed' }
          }
          Write-Host "PUBLIC PORTAL UPDATED: $url SHA256 $sha"

      - name: Report GitHub Releases publication denial without mislabeling CI artifact
        if: github.ref == 'refs/heads/main' && steps.release.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Warning "Setup EXE was built and uploaded only as a GitHub Actions artifact. GitHub Releases publishing was denied or failed."
          "EXE build passed, but the public direct-download GitHub Release was NOT published. Do not update the X-Stage public manifest until a verified release asset exists." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
