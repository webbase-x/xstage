name: X-Stage Mirror TV - AirPlay APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-xstage-mirror-tv.yml"
      - "xstage-mirror-tv/**"
      - "mirror-tv/**"
      - "!mirror-tv/latest.json"
      - "!mirror-tv/test-latest.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xstage-mirror-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror-tv:
    # Never expose repository signing secrets to manual runs on other branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      # Optional narrowly scoped GitHub publishing token when the built-in token cannot create Releases.
      GH_TOKEN: ${{ secrets.XSTAGE_MIRROR_PUBLISH_TOKEN || github.token }}
      # One persistent PRIVATE identity for signed previews and official releases.
      # Never place a release keystore, passwords, or aliases in source control.
      XSTAGE_MIRROR_KEYSTORE_BASE64: ${{ secrets.XSTAGE_MIRROR_KEYSTORE_BASE64 }}
      XSTAGE_MIRROR_STORE_PASSWORD: ${{ secrets.XSTAGE_MIRROR_STORE_PASSWORD }}
      XSTAGE_MIRROR_KEY_ALIAS: ${{ secrets.XSTAGE_MIRROR_KEY_ALIAS }}
      XSTAGE_MIRROR_KEY_PASSWORD: ${{ secrets.XSTAGE_MIRROR_KEY_PASSWORD }}
    steps:
      - name: Checkout X-Stage source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.XSTAGE_MIRROR_PUBLISH_TOKEN || github.token }}

      - name: Validate Mirror TV UI recipe and regression syntax before signing
        shell: bash
        run: |
          python3 -m py_compile xstage-mirror-tv/prepare_upstream.py xstage-mirror-tv/test_build_recipe.py xstage-mirror-tv/video_playback_recovery.py xstage-mirror-tv/verify_apk_signer.py
          python3 xstage-mirror-tv/verify_apk_signer.py --self-test
          node --check scripts/regression.mjs
          python3 - <<'PY'
          from pathlib import Path
          editor = Path("xstage-mirror-tv/ReceiverNameEditor.kt").read_text()
          recipe = Path("xstage-mirror-tv/prepare_upstream.py").read_text()
          assert "onDone = { saveName() }" in editor
          assert "fieldBringIntoView.bringIntoView()" in editor
          assert "left = saveFocus" in editor and "right = cancelFocus" in editor
          assert 'VERSION = os.environ.get("XSTAGE_MIRROR_VERSION", "0.2.17")' in recipe
          assert 'BUILD = os.environ.get("XSTAGE_MIRROR_BUILD", "119")' in recipe
          assert "right = tabFocus[index + 1]" in recipe
          assert "right = choiceFocus[index + 1]" in recipe
          print("PASS: Mirror TV UI source and remote focus preflight")
          PY

      - name: Require persistent private signing key before any release build
        shell: bash
        run: |
          python3 - <<'PY'
          import os,sys,base64
          from pathlib import Path
          names=("XSTAGE_MIRROR_KEYSTORE_BASE64","XSTAGE_MIRROR_STORE_PASSWORD",
                 "XSTAGE_MIRROR_KEY_ALIAS","XSTAGE_MIRROR_KEY_PASSWORD")
          missing=[name for name in names if not os.environ.get(name)]
          if missing:
              sys.exit("Mirror TV preview publication is intentionally blocked: configure the four private XSTAGE_MIRROR_* signing secrets in GitHub Actions. Missing: "+", ".join(missing)+". Never fall back to a rotating debug key.")
          key=base64.b64decode(os.environ["XSTAGE_MIRROR_KEYSTORE_BASE64"],validate=True)
          if len(key)<100: sys.exit("Invalid Mirror signing keystore content")
          dest=Path(os.environ["RUNNER_TEMP"])/"xstage-mirror-signing.jks"
          dest.write_bytes(key)
          dest.chmod(0o600)
          print("Persistent Mirror TV signing secrets are present; key material remains outside the checkout.")
          PY

      - name: Fetch pinned GPLv3 AirPlay receiver source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/omerekelly/airshow.git /tmp/xstage-mirror-airplay
          git -C /tmp/xstage-mirror-airplay checkout --detach a0eeef208a60f69a56faadbd39eb1e1de001208c
          test "$(git -C /tmp/xstage-mirror-airplay rev-parse HEAD)" = "a0eeef208a60f69a56faadbd39eb1e1de001208c"
          git -C /tmp/xstage-mirror-airplay submodule update --init --recursive --depth 1
          test -f /tmp/xstage-mirror-airplay/LICENSE
          test -f /tmp/xstage-mirror-airplay/NOTICE

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate private keystore before expensive native compilation
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/xstage-mirror-signing.jks"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/xstage-mirror-signing.jks" \
            -alias "$XSTAGE_MIRROR_KEY_ALIAS" \
            -storepass:env XSTAGE_MIRROR_STORE_PASSWORD >/dev/null
          echo "PASS: permanent signing keystore, alias and store password"

      - name: Prepare all-in-one APK with bundled AirPlay engine and update client
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 xstage-mirror-tv/prepare_upstream.py /tmp/xstage-mirror-airplay
          python3 xstage-mirror-tv/test_build_recipe.py /tmp/xstage-mirror-airplay

      - name: Configure signed release variant (no debug-signed APK)
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          store=Path(os.environ["RUNNER_TEMP"])/"xstage-mirror-signing.jks"
          assert store.is_file()
          props={
            "storeFile":str(store),
            "storePassword":os.environ["XSTAGE_MIRROR_STORE_PASSWORD"],
            "keyAlias":os.environ["XSTAGE_MIRROR_KEY_ALIAS"],
            "keyPassword":os.environ["XSTAGE_MIRROR_KEY_PASSWORD"],
          }
          def esc(v): return v.replace("\\","\\\\").replace("\n","\\n").replace("\r","\\r")
          output=Path("/tmp/xstage-mirror-airplay/local.properties")
          output.write_text("\n".join(k+"="+esc(v) for k,v in props.items())+"\n",encoding="utf-8")
          output.chmod(0o600)
          print("Gradle release signing configured with a single private identity.")
          PY

      - name: Install Android API 37 and native toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Compile release-variant Android TV APK using the PERSISTENT signing identity
        working-directory: /tmp/xstage-mirror-airplay
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -Pabis=arm64-v8a,armeabi-v7a --stacktrace --no-daemon
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Package APK and GPLv3 corresponding source
        shell: bash
        run: |
          mkdir -p dist
          cp /tmp/xstage-mirror-airplay/app/build/outputs/apk/release/app-release.apk dist/X-Stage-Mirror-TV-signed-preview.apk
          cd /tmp/xstage-mirror-airplay
          tar --exclude=.git --exclude=.gradle --exclude=build --exclude=.cxx --exclude='*.apk' \
              --exclude=local.properties --exclude='*.jks' --exclude='*.keystore' --exclude='*.p12' \
              -czf "$GITHUB_WORKSPACE/dist/X-Stage-Mirror-TV-GPLv3-source.tar.gz" .
          cd "$GITHUB_WORKSPACE"
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Verify signed test APK and prepare distribution
        id: preview
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/X-Stage-Mirror-TV-signed-preview.apk"
          CERT_SHA256=$(python3 xstage-mirror-tv/verify_apk_signer.py \
            --apk "$APK" \
            --keystore "$RUNNER_TEMP/xstage-mirror-signing.jks" \
            --alias "$XSTAGE_MIRROR_KEY_ALIAS" \
            --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner")
          if ! [[ "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Cannot verify persistent APK signing certificate SHA-256"; exit 1
          fi
          # Never rotate an already-published persistent signing identity.
          PREVIOUS_SHA=$(python3 - <<'PY'
          import json
          with open('mirror-tv/test-latest.json',encoding='utf-8') as f: data=json.load(f)
          print(data.get('signer_sha256','') if data.get('signing_mode')=='persistent' else '')
          PY
          )
          STABLE_SHA=$(python3 - <<'PY'
          import json
          m=json.load(open('mirror-tv/latest.json',encoding='utf-8'))
          print(m.get('signer_sha256','') if m.get('signing_mode')=='persistent' else '')
          PY
          )
          for PIN in "$PREVIOUS_SHA" "$STABLE_SHA"; do
            if [ -n "$PIN" ] && [ "$PIN" != "$CERT_SHA256" ]; then
              echo "::error::Signing certificate changed! Refusing to publish a non-updatable APK."; exit 1
            fi
          done
          # Audit the installed legacy test APK's *actual* signer. Neither
          # version numbers nor APK checksums can override Android's key check.
          LEGACY_TAG="xstage-mirror-tv-test-v0.2.5-build107-8bdc61a4"
          LEGACY_APK="X-Stage-Mirror-TV-test-v0.2.5-build107.apk"
          mkdir -p "$RUNNER_TEMP/mirror-legacy"
          if gh release download "$LEGACY_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$LEGACY_APK" --dir "$RUNNER_TEMP/mirror-legacy"; then
            if LEGACY_SHA=$(python3 xstage-mirror-tv/verify_apk_signer.py \
              --apk "$RUNNER_TEMP/mirror-legacy/$LEGACY_APK" \
              --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner"); then
              if [ "$LEGACY_SHA" = "$CERT_SHA256" ]; then
                echo "Build 107 public preview and new release share the same signer: in-place update eligible"
              else
                echo "::warning::Build 107's public APK signer differs from this build. Android cannot upgrade Build 107 in place without the original private signing key."
              fi
            else
              echo "::warning::Could not validate legacy Build 107 APK signer; no in-place migration claim."
            fi
          else
            echo "::warning::Cannot audit legacy Build 107 APK; do not claim guaranteed in-place migration."
          fi
          echo "signer_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "Validated a persistent APK signing certificate; SHA-256=$CERT_SHA256"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.webbasex.xstagemirror.tv'"
          VERSION=$(python3 - <<'PY'
          import pathlib,re
          content=pathlib.Path("xstage-mirror-tv/prepare_upstream.py").read_text()
          match=re.search(r'VERSION\s*=\s*os\.environ\.get\("XSTAGE_MIRROR_VERSION",\s*"([0-9.]+)"\)',content)
          if not match: raise SystemExit("Version missing")
          print(match.group(1))
          PY
          )
          BUILD=$(python3 - <<'PY'
          import pathlib,re
          content=pathlib.Path("xstage-mirror-tv/prepare_upstream.py").read_text()
          match=re.search(r'BUILD\s*=\s*os\.environ\.get\("XSTAGE_MIRROR_BUILD",\s*"([0-9]+)"\)',content)
          if not match: raise SystemExit("Build number missing")
          print(match.group(1))
          PY
          )
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -F "versionCode='$BUILD'"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -F "versionName='$VERSION'"
          TEST_FILE="X-Stage-Mirror-TV-test-v${VERSION}-build${BUILD}.apk"
          mv "$APK" "dist/$TEST_FILE"
          (cd dist && sha256sum "$TEST_FILE" X-Stage-Mirror-TV-GPLv3-source.tar.gz > SHA256SUMS.txt)
          TAG="xstage-mirror-tv-test-v${VERSION}-build${BUILD}-${GITHUB_SHA:0:8}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$TEST_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "dist/$TEST_FILE" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload verified APK and complete GPLv3 source even if Releases API is forbidden
        if: steps.preview.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: X-Stage-Mirror-TV-AndroidTV-build${{ steps.preview.outputs.build }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease when token has Release permission
        id: publication
        if: steps.preview.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          TAG: ${{ steps.preview.outputs.tag }}
          TEST_FILE: ${{ steps.preview.outputs.apk }}
          VERSION: ${{ steps.preview.outputs.version }}
          BUILD: ${{ steps.preview.outputs.build }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            for asset in "$TEST_FILE" X-Stage-Mirror-TV-GPLv3-source.tar.gz SHA256SUMS.txt; do
              gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$asset"
            done
            echo "Already published complete prerelease: $TAG"
          else
            gh release create "$TAG" "dist/$TEST_FILE" dist/X-Stage-Mirror-TV-GPLv3-source.tar.gz dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title "X-Stage Mirror TV v${VERSION} Build ${BUILD} — test preview" \
              --notes "Persistent-key signed APK: signer verified against private keystore. Debug-signed Build 107 needs a one-time uninstall if signing identities differ. GPLv3 corresponding source and checksums are included."
            echo "Published prerelease: $TAG"
          fi

      - name: Update test download feed without touching production signing feed
        if: steps.preview.outcome == 'success'
        shell: bash
        env:
          TAG: ${{ steps.preview.outputs.tag }}
          APK_FILE: ${{ steps.preview.outputs.apk }}
          VERSION: ${{ steps.preview.outputs.version }}
          BUILD: ${{ steps.preview.outputs.build }}
          SHA256: ${{ steps.preview.outputs.sha256 }}
          SIGNER_SHA256: ${{ steps.preview.outputs.signer_sha256 }}
          RELEASE_PUBLISHED: ${{ steps.publication.outcome == 'success' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -C main origin/main
          # The verified test APK remains in dist after switching branches.
          # Publish this exact binary on Pages for TrueID/Android TV browsers
          # which cannot follow external GitHub Releases redirects.
          mkdir -p downloads
          cp "dist/$APK_FILE" "downloads/$APK_FILE"
          # If Releases API is blocked, supply corresponding GPLv3 source
          # alongside the APK on GitHub Pages; never advertise a missing Release.
          SOURCE_FILE="X-Stage-Mirror-TV-GPLv3-source-v${VERSION}-build${BUILD}.tar.gz"
          if [ "$RELEASE_PUBLISHED" != "true" ]; then
            SOURCE_SIZE=$(stat -c '%s' dist/X-Stage-Mirror-TV-GPLv3-source.tar.gz)
            if [ "$SOURCE_SIZE" -gt 95000000 ]; then
              echo "::error::GPL source archive too large for safe Pages git publication"
              exit 1
            fi
            cp dist/X-Stage-Mirror-TV-GPLv3-source.tar.gz "downloads/$SOURCE_FILE"
            sha256sum "downloads/$SOURCE_FILE" > "downloads/$SOURCE_FILE.sha256"
            echo "::warning::GitHub Releases API denied publishing. Will publish verified signed APK plus GPLv3 source on GitHub Pages."
          fi
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          binary=Path("downloads")/os.environ["APK_FILE"]
          actual=hashlib.sha256(binary.read_bytes()).hexdigest()
          if actual!=os.environ["SHA256"]: raise SystemExit("Direct APK SHA-256 mismatch")
          if not __import__('re').fullmatch(r'[0-9a-f]{64}',os.environ['SIGNER_SHA256']):
              raise SystemExit("Persistent signer fingerprint missing")
          release_published=os.environ["RELEASE_PUBLISHED"]=="true"
          direct_url="https://webbase-x.github.io/xstage/downloads/"+os.environ["APK_FILE"]
          release_url="https://github.com/webbase-x/xstage/releases/download/"+os.environ["TAG"]+"/"+os.environ["APK_FILE"]
          source_file="X-Stage-Mirror-TV-GPLv3-source-v"+os.environ["VERSION"]+"-build"+os.environ["BUILD"]+".tar.gz"
          source_url=("https://github.com/webbase-x/xstage/releases/download/"+os.environ["TAG"]+"/X-Stage-Mirror-TV-GPLv3-source.tar.gz") if release_published else ("https://webbase-x.github.io/xstage/downloads/"+source_file)
          data={
            "channel":"test-preview",
            "available":True,"name":"X-Stage Mirror TV Test APK",
            "package":"com.webbasex.xstagemirror.tv",
            "version":os.environ["VERSION"],"build":int(os.environ["BUILD"]),
            "file":os.environ["APK_FILE"],"sha256":os.environ["SHA256"],
            "download_url":release_url if release_published else direct_url,
            "release_download_available":release_published,
            "source_url":source_url,
            "signing_mode":"persistent",
            "signer_sha256":os.environ["SIGNER_SHA256"],
            "note":"Signed APK with persistent private certificate used for this channel and production. Newer builds with matching installed certificate can be installed in place with Android system approval. Debug-signed legacy Builds <=107 may require a one-time uninstall."
          }
          data.update({
            "direct_download_available":True,
            "direct_download_file":os.environ["APK_FILE"],
            "direct_download_sha256":actual,
            "direct_download_url":"https://webbase-x.github.io/xstage/downloads/"+os.environ["APK_FILE"]
          })
          Path("mirror-tv/test-latest.json").write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          (Path("downloads")/(os.environ["APK_FILE"]+".sha256")).write_text(
            actual+"  "+os.environ["APK_FILE"]+"\n",encoding="ascii")
          PY
          git add mirror-tv/test-latest.json "downloads/$APK_FILE" "downloads/$APK_FILE.sha256"
          if [ "$RELEASE_PUBLISHED" != "true" ]; then
            git add "downloads/$SOURCE_FILE" "downloads/$SOURCE_FILE.sha256"
          fi
          if git diff --cached --quiet; then
            echo "No preview feed changes"
          else
            git commit -m "build(mirror): publish verified test APK metadata [skip ci]"
            for attempt in 1 2 3 4; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Mirror preview metadata published"
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "::error::Cannot publish preview feed"
                exit 1
              fi
            done
          fi

