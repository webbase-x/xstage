name: X-Stage Song Studio PC Source ZIP (private-only distribution disabled on public repo)

# This public repository never publishes source-only archives.
# Restore a source-packaging workflow only inside a PRIVATE source repository
# with repository collaborator access restricted to the approved maintainers.
# Consumer-facing binaries are published by build-songstudio-pc-ready.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-distribution-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Explain private-source requirement
        run: |
          echo "::notice::No source ZIP will be generated or published from this public repository."
          echo "::notice::Move proprietary development sources to a private GitHub repository and grant explicit collaborator permissions before distributing source-only archives."
          echo "::notice::Public runnable app releases remain independent of this workflow."
