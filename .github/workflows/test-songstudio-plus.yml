name: X-Stage Song Studio Plus · Tests and Windows Preview

on:
  push:
    branches: [main]
    paths:
      - "songstudio-plus/**"
      - ".github/workflows/test-songstudio-plus.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xstage-songstudio-plus-main
  cancel-in-progress: true

jobs:
  core-and-web:
    name: SQLite, NCN, X-media and UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile standalone app
        run: python -m compileall -q songstudio-plus
      - name: Test SHA-256, NCN, versioned lyrics, undo and embedded file
        run: python -m unittest discover -s songstudio-plus/tests -p "test_*.py" -v
      - name: JavaScript syntax check
        run: node --check songstudio-plus/web/app.js
      - name: Static app and security surface contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,"songstudio-plus")
          import app
          assert app.Handler.server_version.startswith("XStageSongStudioPlus")
          page=Path("songstudio-plus/web/index.html").read_text(encoding="utf-8")
          for token in ['data-view="import"','data-view="lyrics"','data-view="media"','data-view="preview"','data-view="build"','data-view="library"','data-view="risks"']:
              assert token in page,token
          assert "Lyrics JSON" not in page
          assert ".xsk" not in page.lower()
          print("PASS: seven-menu standalone app with real pre-export preview")
          PY

  windows-preview:
    name: Build portable Windows EXE (preview only)
    needs: core-and-web
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install isolated EXE builder
        run: python -m pip install "pyinstaller>=6,<7" "pillow>=11,<13" "PySide6>=6.8,<7"
      - name: Build standalone EXE with embedded web frontend
        shell: pwsh
        run: |
          python songstudio-plus/make_icon.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon "songstudio-plus/app-plus.ico" --name "X-Stage-Song-Studio-Plus-v0.1.7-preview" --paths "songstudio-plus" --add-data "songstudio-plus/web;web" --add-data "songstudio-plus/app-plus.ico;." --hidden-import "PySide6.QtWebEngineWidgets" --hidden-import "PySide6.QtWebEngineCore" songstudio-plus/app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller returned failure" }
          if (!(Test-Path "dist/X-Stage-Song-Studio-Plus-v0.1.7-preview.exe")) { throw "EXE not produced" }
      - name: Verify EXE hash and package preview
        shell: pwsh
        run: |
          $exe="dist/X-Stage-Song-Studio-Plus-v0.1.7-preview.exe"
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "X-Stage Song Studio Plus v0.1.7 Native Windows Preview" | Out-File "dist/README-Preview.txt" -Encoding UTF8
          "SHA-256: $hash" | Out-File "dist/README-Preview.txt" -Encoding UTF8 -Append
          "Local-only SQLite Engine. Original media prebuild preview (WinMM MIDI) included. X-container player integration pending. Binary not code-signed." | Out-File "dist/README-Preview.txt" -Encoding UTF8 -Append
          Write-Host "EXE SHA-256 $hash"
      - uses: actions/upload-artifact@v6
        with:
          name: X-Stage-Song-Studio-Plus-v0.1.7-Windows-Preview
          path: |
            dist/X-Stage-Song-Studio-Plus-v0.1.7-preview.exe
            dist/README-Preview.txt
          retention-days: 14
          if-no-files-found: error
