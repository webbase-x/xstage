name: Experimental Hybrid SQLite Range
on:
  pull_request:
    paths:
      - 'experiments/hybrid-sqlite/**'
      - 'scripts/hybrid-sqlite-*.mjs'
      - '.github/workflows/test-hybrid-sqlite-range.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  range-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate bounded range and indexed queries
        run: node scripts/hybrid-sqlite-range-test.mjs
      - name: Install isolated browser experiment dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0 @journeyapps/wa-sqlite@2.0.7
          npx playwright install --with-deps chromium
      - name: Test SQLite WASM against strict HTTP 206
        run: node scripts/hybrid-sqlite-browser-e2e.mjs
      - name: Package same-origin WASM diagnostic preview
        run: |
          mkdir -p experiments/hybrid-sqlite/vendor
          cp -R node_modules/@journeyapps/wa-sqlite/dist node_modules/@journeyapps/wa-sqlite/src experiments/hybrid-sqlite/vendor/
          cp node_modules/@journeyapps/wa-sqlite/package.json experiments/hybrid-sqlite/vendor/
          if [ -f node_modules/@journeyapps/wa-sqlite/LICENSE ]; then cp node_modules/@journeyapps/wa-sqlite/LICENSE experiments/hybrid-sqlite/vendor/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-sqlite-same-origin-wasm-preview
          path: experiments/hybrid-sqlite/vendor/
          if-no-files-found: error
