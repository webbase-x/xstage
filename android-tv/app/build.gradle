plugins {
    id 'com.android.application'
}

def releaseMeta = new groovy.json.JsonSlurper().parse(rootProject.file("../version.json"))
def tvClientId = (project.findProperty("XSTAGE_TV_OAUTH_CLIENT_ID") ?: System.getenv("XSTAGE_TV_OAUTH_CLIENT_ID") ?: "").toString()
def tvClientSecret = (project.findProperty("XSTAGE_TV_OAUTH_CLIENT_SECRET") ?: System.getenv("XSTAGE_TV_OAUTH_CLIENT_SECRET") ?: "").toString()
def quoteBuildConfig = { value -> '"' + value.replace('\\','\\\\').replace('"','\\"') + '"' }

def keyStorePath = System.getenv("XSTAGE_KEYSTORE_PATH") ?: ""
def keyStorePassword = System.getenv("XSTAGE_KEYSTORE_PASSWORD") ?: ""
def keyAliasName = System.getenv("XSTAGE_KEY_ALIAS") ?: ""
def keyPasswordValue = System.getenv("XSTAGE_KEY_PASSWORD") ?: ""
def signingReady = keyStorePath && keyStorePassword && keyAliasName && keyPasswordValue && file(keyStorePath).exists()

android {
    namespace 'com.webbasex.xstage'
    compileSdk 35

    defaultConfig {
        applicationId 'com.webbasex.xstage'
        minSdk 23
        targetSdk 34
        versionCode (releaseMeta.build as Integer)
        versionName releaseMeta.version.toString()

        buildConfigField "String", "XSTAGE_TV_OAUTH_CLIENT_ID", quoteBuildConfig(tvClientId)
        buildConfigField "String", "XSTAGE_TV_OAUTH_CLIENT_SECRET", quoteBuildConfig(tvClientSecret)
        buildConfigField "String", "XSTAGE_WEB_URL", quoteBuildConfig("https://webbase-x.github.io/xstage/")
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Public test/sideload key: intentionally stable so browser-downloaded test APKs can update in place.
        // Never use this key for Google Play production signing.
        testSideload {
            storeFile rootProject.file("test-signing/xstage-test-update.jks")
            storePassword "xstage-test-update"
            keyAlias "xstage-test"
            keyPassword "xstage-test-update"
        }
        if (signingReady) {
            release {
                storeFile file(keyStorePath)
                storePassword keyStorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            signingConfig signingConfigs.testSideload
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register("generateXStageTvAssets") {
    def iconFile = file("src/main/res/drawable-nodpi/xstage_app_icon.png")
    def bannerFile = file("src/main/res/drawable-nodpi/xstage_tv_banner.png")
    def splashFile = file("src/main/res/drawable-nodpi/xstage_tv_splash.png")
    def storeIcon = rootProject.file("store-assets/xstage-play-icon-512.png")
    def storeBanner = rootProject.file("store-assets/xstage-tv-banner-320x180.png")
    outputs.files(iconFile, bannerFile, splashFile, storeIcon, storeBanner)
    inputs.file(rootProject.file("../assets/xstage-stage-logo.png"))

    doLast {
        // Previous builds generated an xhdpi banner. Never package both
        // qualifiers: on xhdpi TVs Android could still select the stale art.
        def staleLauncherBanner = file("src/main/res/drawable-xhdpi/xstage_tv_banner.png")
        if (staleLauncherBanner.exists() && !staleLauncherBanner.delete())
            throw new GradleException("Cannot remove stale xhdpi Android TV banner")
        [iconFile.parentFile, bannerFile.parentFile, splashFile.parentFile, storeIcon.parentFile, storeBanner.parentFile].each { it.mkdirs() }

        // One official user-supplied source for Android TV launcher banner,
        // square launcher icon, Play Store previews and app startup splash.
        // IMPORTANT: do not generate the old X/microphone emblem here.
        def logoSource = rootProject.file("../assets/xstage-stage-logo.png")
        if (!logoSource.isFile()) throw new GradleException("Missing official X-Stage stage logo: " + logoSource)
        def sourceLogo = javax.imageio.ImageIO.read(logoSource)
        if (sourceLogo == null || sourceLogo.getWidth() < 1 || sourceLogo.getHeight() < 1)
            throw new GradleException("Could not decode official stage logo PNG")
        splashFile.bytes = logoSource.bytes

        // Dedicated Karaoke Android launcher artwork. Keep the original stage
        // banner/splash untouched, but do not reuse it as the app-grid icon.
        // Draw at build time with Java2D: independent of external downloads.
        def icon = new java.awt.image.BufferedImage(512, 512, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def g = icon.createGraphics()
        g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
        g.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        g.setPaint(new java.awt.GradientPaint(16f, 18f, new java.awt.Color(28,45,88), 498f, 502f, new java.awt.Color(17,57,53)))
        g.fillRoundRect(9, 9, 494, 494, 108, 108)
        g.setStroke(new java.awt.BasicStroke(7f))
        g.setPaint(new java.awt.GradientPaint(10f,10f,new java.awt.Color(139,241,193),500f,500f,new java.awt.Color(80,146,255)))
        g.drawRoundRect(13, 13, 486, 486, 103, 103)
        // Top-left family X symbol.
        g.setStroke(new java.awt.BasicStroke(15f,java.awt.BasicStroke.CAP_ROUND,java.awt.BasicStroke.JOIN_ROUND))
        g.drawLine(54,45,109,114)
        g.drawLine(110,45,54,114)
        // Theatre-screen silhouette with violet stage and a prominent play key.
        g.setColor(new java.awt.Color(132,220,255))
        g.setStroke(new java.awt.BasicStroke(11f))
        g.drawRoundRect(70,160,364,204,24,24)
        g.setColor(new java.awt.Color(38,50,118))
        g.fillRoundRect(85,175,334,176,17,17)
        g.setColor(new java.awt.Color(97,103,201,93))
        g.fillPolygon([90,176,264,419] as int[],[337,188,337,337] as int[],4)
        g.setColor(new java.awt.Color(211,255,244))
        g.fillPolygon([222,222,306] as int[],[217,312,265] as int[],3)
        g.setColor(new java.awt.Color(180,237,255))
        g.setStroke(new java.awt.BasicStroke(9f,java.awt.BasicStroke.CAP_ROUND,java.awt.BasicStroke.JOIN_ROUND))
        g.drawLine(197,382,306,382)
        g.drawLine(251,367,251,381)
        // Android TV remote is an identifying feature, unlike Web/PC editions.
        g.setColor(new java.awt.Color(9,23,51))
        g.fillRoundRect(332,264,71,117,26,26)
        g.setColor(new java.awt.Color(173,219,255))
        g.drawRoundRect(332,264,71,117,26,26)
        g.setColor(new java.awt.Color(136,247,193))
        g.fillOval(356,292,24,24)
        g.setStroke(new java.awt.BasicStroke(7f))
        g.drawLine(354,339,377,339)
        g.setFont(new java.awt.Font("SansSerif",java.awt.Font.BOLD,29))
        g.setColor(java.awt.Color.WHITE)
        def label = "KARAOKE TV"
        def metrics = g.getFontMetrics()
        g.drawString(label, (512-metrics.stringWidth(label)).intdiv(2),456)
        g.dispose()
        javax.imageio.ImageIO.write(icon, "png", iconFile)
        javax.imageio.ImageIO.write(icon, "png", storeIcon)

        // White 16:9 (320x180) banner for Android TV and TrueID app grids.
        // The dedicated Karaoke TV app icon is legible on white; the stage
        // splash remains unchanged. Both densities use this same image.
        def banner = new java.awt.image.BufferedImage(320,180,java.awt.image.BufferedImage.TYPE_INT_RGB)
        def b = banner.createGraphics()
        b.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
        b.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
        b.setColor(java.awt.Color.WHITE)
        b.fillRect(0,0,320,180)
        // A dark app-tile symbol makes the product identity visible in both
        // white and dark TV launchers, independently of the original stage art.
        b.drawImage(icon,17,28,115,115,null)
        b.setFont(new java.awt.Font("SansSerif",java.awt.Font.BOLD,30))
        b.setColor(new java.awt.Color(15,32,67))
        b.drawString("X-STAGE",142,78)
        b.setFont(new java.awt.Font("SansSerif",java.awt.Font.BOLD,19))
        b.setColor(new java.awt.Color(26,111,167))
        b.drawString("KARAOKE TV",143,108)
        b.setFont(new java.awt.Font("SansSerif",java.awt.Font.PLAIN,12))
        b.setColor(new java.awt.Color(87,104,126))
        b.drawString("Karaoke for Android TV",143,130)
        b.dispose()
        javax.imageio.ImageIO.write(banner, "png", bannerFile)
        javax.imageio.ImageIO.write(banner, "png", storeBanner)
    }
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("generateXStageTvAssets")
}
