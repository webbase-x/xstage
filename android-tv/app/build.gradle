plugins {
    id 'com.android.application'
}

def releaseMeta = new groovy.json.JsonSlurper().parse(rootProject.file("../version.json"))
def tvClientId = (project.findProperty("XSTAGE_TV_OAUTH_CLIENT_ID") ?: System.getenv("XSTAGE_TV_OAUTH_CLIENT_ID") ?: "").toString()
def tvClientSecret = (project.findProperty("XSTAGE_TV_OAUTH_CLIENT_SECRET") ?: System.getenv("XSTAGE_TV_OAUTH_CLIENT_SECRET") ?: "").toString()
def quoteBuildConfig = { value -> '"' + value.replace('\\','\\\\').replace('"','\\"') + '"' }

def keyStorePath = System.getenv("XSTAGE_KEYSTORE_PATH") ?: ""
def keyStorePassword = System.getenv("XSTAGE_KEYSTORE_PASSWORD") ?: ""
def keyAliasName = System.getenv("XSTAGE_KEY_ALIAS") ?: ""
def keyPasswordValue = System.getenv("XSTAGE_KEY_PASSWORD") ?: ""
def signingReady = keyStorePath && keyStorePassword && keyAliasName && keyPasswordValue && file(keyStorePath).exists()

android {
    namespace 'com.webbasex.xstage'
    compileSdk 35

    defaultConfig {
        applicationId 'com.webbasex.xstage'
        minSdk 23
        targetSdk 34
        versionCode (releaseMeta.build as Integer)
        versionName releaseMeta.version.toString()

        buildConfigField "String", "XSTAGE_TV_OAUTH_CLIENT_ID", quoteBuildConfig(tvClientId)
        buildConfigField "String", "XSTAGE_TV_OAUTH_CLIENT_SECRET", quoteBuildConfig(tvClientSecret)
        buildConfigField "String", "XSTAGE_WEB_URL", quoteBuildConfig("https://webbase-x.github.io/xstage/")
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Public test/sideload key: intentionally stable so browser-downloaded test APKs can update in place.
        // Never use this key for Google Play production signing.
        testSideload {
            storeFile rootProject.file("test-signing/xstage-test-update.jks")
            storePassword "xstage-test-update"
            keyAlias "xstage-test"
            keyPassword "xstage-test-update"
        }
        if (signingReady) {
            release {
                storeFile file(keyStorePath)
                storePassword keyStorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            signingConfig signingConfigs.testSideload
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register("generateXStageTvAssets") {
    def iconFile = file("src/main/res/drawable-nodpi/xstage_app_icon.png")
    def bannerFile = file("src/main/res/drawable-nodpi/xstage_tv_banner.png")
    def splashFile = file("src/main/res/drawable-nodpi/xstage_tv_splash.png")
    def storeIcon = rootProject.file("store-assets/xstage-play-icon-512.png")
    def storeBanner = rootProject.file("store-assets/xstage-tv-banner-320x180.png")
    outputs.files(iconFile, bannerFile, splashFile, storeIcon, storeBanner)
    inputs.file(rootProject.file("../assets/xstage-stage-logo.png"))

    doLast {
        [iconFile.parentFile, bannerFile.parentFile, splashFile.parentFile, storeIcon.parentFile, storeBanner.parentFile].each { it.mkdirs() }

        // One official user-supplied source for Android TV launcher banner,
        // square launcher icon, Play Store previews and app startup splash.
        // IMPORTANT: do not generate the old X/microphone emblem here.
        def logoSource = rootProject.file("../assets/xstage-stage-logo.png")
        if (!logoSource.isFile()) throw new GradleException("Missing official X-Stage stage logo: " + logoSource)
        def sourceLogo = javax.imageio.ImageIO.read(logoSource)
        if (sourceLogo == null || sourceLogo.getWidth() < 1 || sourceLogo.getHeight() < 1)
            throw new GradleException("Could not decode official stage logo PNG")
        splashFile.bytes = logoSource.bytes

        // Some Google TV / Android TV launchers render android:icon instead of
        // android:banner in the app grid. Both MUST show this same full image.
        def icon = new java.awt.image.BufferedImage(512, 512, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def g = icon.createGraphics()
        g.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
        g.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        g.setColor(java.awt.Color.BLACK)
        g.fillRect(0,0,512,512)
        double iconScale = Math.min(488d/sourceLogo.getWidth(), 480d/sourceLogo.getHeight())
        int iconW = Math.max(1,Math.round(sourceLogo.getWidth()*iconScale) as int)
        int iconH = Math.max(1,Math.round(sourceLogo.getHeight()*iconScale) as int)
        int iconLeft = (512-iconW).intdiv(2)
        int iconTop = (512-iconH).intdiv(2)
        g.drawImage(sourceLogo,iconLeft,iconTop,iconW,iconH,null)
        g.dispose()
        javax.imageio.ImageIO.write(icon, "png", iconFile)
        javax.imageio.ImageIO.write(icon, "png", storeIcon)

        // Android TV launcher banner is fixed 16:9 (320x180). Keep the
        // 2048x682 original aspect ratio: contain, centered, never crop/stretch.
        // A black background matches the user's supplied transparent PNG.
        def banner = new java.awt.image.BufferedImage(320,180,java.awt.image.BufferedImage.TYPE_INT_RGB)
        def b = banner.createGraphics()
        b.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
        b.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        b.setColor(java.awt.Color.BLACK)
        b.fillRect(0,0,320,180)
        double scale = Math.min(316d/sourceLogo.getWidth(), 172d/sourceLogo.getHeight())
        int scaledW = Math.max(1,Math.round(sourceLogo.getWidth()*scale) as int)
        int scaledH = Math.max(1,Math.round(sourceLogo.getHeight()*scale) as int)
        int left = (320-scaledW).intdiv(2)
        int top = (180-scaledH).intdiv(2)
        b.drawImage(sourceLogo,left,top,scaledW,scaledH,null)
        b.dispose()
        javax.imageio.ImageIO.write(banner, "png", bannerFile)
        javax.imageio.ImageIO.write(banner, "png", storeBanner)
    }
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("generateXStageTvAssets")
}
