plugins {
    id 'com.android.application'
}

def releaseMeta = new groovy.json.JsonSlurper().parse(rootProject.file("../version.json"))
def tvClientId = (project.findProperty("XSTAGE_TV_OAUTH_CLIENT_ID") ?: System.getenv("XSTAGE_TV_OAUTH_CLIENT_ID") ?: "").toString()
def tvClientSecret = (project.findProperty("XSTAGE_TV_OAUTH_CLIENT_SECRET") ?: System.getenv("XSTAGE_TV_OAUTH_CLIENT_SECRET") ?: "").toString()
def quoteBuildConfig = { value -> '"' + value.replace('\\','\\\\').replace('"','\\"') + '"' }

def keyStorePath = System.getenv("XSTAGE_KEYSTORE_PATH") ?: ""
def keyStorePassword = System.getenv("XSTAGE_KEYSTORE_PASSWORD") ?: ""
def keyAliasName = System.getenv("XSTAGE_KEY_ALIAS") ?: ""
def keyPasswordValue = System.getenv("XSTAGE_KEY_PASSWORD") ?: ""
def signingReady = keyStorePath && keyStorePassword && keyAliasName && keyPasswordValue && file(keyStorePath).exists()

android {
    namespace 'com.webbasex.xstage'
    compileSdk 35

    defaultConfig {
        applicationId 'com.webbasex.xstage'
        minSdk 23
        targetSdk 34
        versionCode (releaseMeta.build as Integer)
        versionName releaseMeta.version.toString()

        buildConfigField "String", "XSTAGE_TV_OAUTH_CLIENT_ID", quoteBuildConfig(tvClientId)
        buildConfigField "String", "XSTAGE_TV_OAUTH_CLIENT_SECRET", quoteBuildConfig(tvClientSecret)
        buildConfigField "String", "XSTAGE_WEB_URL", quoteBuildConfig("https://webbase-x.github.io/xstage/")
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Public test/sideload key: intentionally stable so browser-downloaded test APKs can update in place.
        // Never use this key for Google Play production signing.
        testSideload {
            storeFile rootProject.file("test-signing/xstage-test-update.jks")
            storePassword "xstage-test-update"
            keyAlias "xstage-test"
            keyPassword "xstage-test-update"
        }
        if (signingReady) {
            release {
                storeFile file(keyStorePath)
                storePassword keyStorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            signingConfig signingConfigs.testSideload
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register("generateXStageTvAssets") {
    def iconFile = file("src/main/res/drawable-nodpi/xstage_app_icon.png")
    def bannerFile = file("src/main/res/drawable-xhdpi/xstage_tv_banner.png")
    def storeIcon = rootProject.file("store-assets/xstage-play-icon-512.png")
    def storeBanner = rootProject.file("store-assets/xstage-tv-banner-320x180.png")
    outputs.files(iconFile, bannerFile, storeIcon, storeBanner)

    doLast {
        [iconFile.parentFile, bannerFile.parentFile, storeIcon.parentFile, storeBanner.parentFile].each { it.mkdirs() }

        def icon = new java.awt.image.BufferedImage(512, 512, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def g = icon.createGraphics()
        g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
        g.setColor(new java.awt.Color(6,19,33)); g.fillRoundRect(8,8,496,496,90,90)
        g.setColor(new java.awt.Color(34,212,255)); g.setStroke(new java.awt.BasicStroke(8f)); g.drawRoundRect(8,8,496,496,90,90)
        g.setStroke(new java.awt.BasicStroke(44f, java.awt.BasicStroke.CAP_ROUND, java.awt.BasicStroke.JOIN_ROUND))
        g.setColor(new java.awt.Color(60,235,255)); g.drawLine(120,105,390,375)
        g.setColor(new java.awt.Color(113,91,255)); g.drawLine(390,105,120,375)
        g.setColor(new java.awt.Color(240,250,255))
        g.setStroke(new java.awt.BasicStroke(14f, java.awt.BasicStroke.CAP_ROUND, java.awt.BasicStroke.JOIN_ROUND))
        g.drawRoundRect(218,160,76,140,72,72)
        g.drawArc(195,220,122,118,180,180)
        g.drawLine(256,330,256,392)
        g.drawLine(205,398,307,398)
        g.dispose()
        javax.imageio.ImageIO.write(icon, "png", iconFile)
        javax.imageio.ImageIO.write(icon, "png", storeIcon)

        // 320x180 Android TV launcher banner, derived from the transparent neon
        // X-Stage microphone/X/equalizer branding in assets/xstage-tv-pro-logo.svg.
        // Java2D renders it offline: no network, fonts, or runtime services required.
        def banner = new java.awt.image.BufferedImage(320,180,java.awt.image.BufferedImage.TYPE_INT_RGB)
        def b = banner.createGraphics()
        b.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING,java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
        b.setRenderingHint(java.awt.RenderingHints.KEY_TEXT_ANTIALIASING,java.awt.RenderingHints.VALUE_TEXT_ANTIALIAS_ON)
        b.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        b.setColor(java.awt.Color.WHITE); b.fillRect(0,0,320,180)
        def cyan = new java.awt.Color(0,217,255)
        def blue = new java.awt.Color(49,125,250)
        def purple = new java.awt.Color(122,65,224)
        def magenta = new java.awt.Color(230,55,217)
        // Restrained music wave and equalizer highlights behind a legible logo.
        b.setColor(new java.awt.Color(228,244,255))
        b.fillOval(3,13,135,134)
        b.setColor(new java.awt.Color(247,234,255))
        b.fillOval(235,80,85,80)
        [24,39,32,54,43,25,45].eachWithIndex { h,i ->
            b.setColor(i%2==0 ? new java.awt.Color(81,192,250,120) : new java.awt.Color(181,91,229,120))
            b.fillRoundRect((6+i*10) as int,(98-((h as int).intdiv(2))) as int,6,h as int,5,5)
        }
        // Stylized gradient X: same signature emblem as the approved transparent logo.
        b.setStroke(new java.awt.BasicStroke(15f,java.awt.BasicStroke.CAP_ROUND,java.awt.BasicStroke.JOIN_ROUND))
        b.setColor(purple); b.drawLine(31,37,103,120)
        b.setColor(cyan); b.drawLine(103,37,31,120)
        b.setStroke(new java.awt.BasicStroke(8f,java.awt.BasicStroke.CAP_ROUND,java.awt.BasicStroke.JOIN_ROUND))
        b.setColor(blue); b.drawLine(34,39,101,118)
        // Glowing microphone and stem.
        b.setColor(new java.awt.Color(255,255,255))
        b.fillRoundRect(57,49,26,52,22,22)
        b.setColor(purple); b.setStroke(new java.awt.BasicStroke(3f))
        b.drawRoundRect(57,49,26,52,22,22)
        b.setColor(blue)
        [62,70,78,86].each { y -> b.drawLine(63,y as int,77,y as int) }
        b.setColor(magenta)
        b.setStroke(new java.awt.BasicStroke(4f,java.awt.BasicStroke.CAP_ROUND,java.awt.BasicStroke.JOIN_ROUND))
        b.drawArc(51,75,38,38,180,180)
        b.drawLine(70,113,70,130); b.drawLine(59,132,81,132)
        // Name: two crisp lines, auto-fit to the remaining width without clipping.
        def fitFont = { String value,int preferred,int width ->
            int n=preferred
            def fnt=new java.awt.Font("SansSerif",java.awt.Font.BOLD|java.awt.Font.ITALIC,n)
            while(n>10 && b.getFontMetrics(fnt).stringWidth(value)>width) {
                fnt=new java.awt.Font("SansSerif",java.awt.Font.BOLD|java.awt.Font.ITALIC,--n)
            }
            fnt
        }
        def topText="X-Stage"
        b.setFont(fitFont(topText,52,196))
        b.setColor(new java.awt.Color(104,67,180,80)); b.drawString(topText,117,84)
        b.setPaint(new java.awt.GradientPaint(120,42,blue,308,95,magenta))
        b.drawString(topText,115,82)
        b.setStroke(new java.awt.BasicStroke(3f,java.awt.BasicStroke.CAP_ROUND,java.awt.BasicStroke.JOIN_ROUND))
        b.setPaint(new java.awt.GradientPaint(120,0,cyan,302,0,purple))
        b.drawLine(120,94,304,94)
        def bottomText="Karaoke Online"
        b.setFont(fitFont(bottomText,24,195))
        b.setColor(new java.awt.Color(72,49,154))
        b.drawString(bottomText,115,123)
        b.setStroke(new java.awt.BasicStroke(1.5f))
        b.setColor(new java.awt.Color(230,217,248)); b.drawRoundRect(1,1,318,178,18,18)
        b.dispose()
        javax.imageio.ImageIO.write(banner, "png", bannerFile)
        javax.imageio.ImageIO.write(banner, "png", storeBanner)
    }
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("generateXStageTvAssets")
}
