<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X-Stage Karaoke Online — Private Drive</title><link rel="stylesheet" href="style.css"></head><body><main><section class="hero"><div class="brand-mark"><span>X</span></div><p class="eyebrow">X-STAGE KARAOKE</p><h1>X-Stage Karaoke Online</h1><p class="subtitle">เข้าถึงเฉพาะเพลงที่อยู่ใน Google Drive ของคุณ</p><button id="login" class="google-login">G &nbsp; เข้าสู่ระบบ Google</button><button id="logout" type="button">ออกจากระบบ / เปลี่ยนบัญชี</button><span id="account"></span></section><section id="status" role="status">กรุณาเข้าสู่ระบบเพื่อเปิดคลังเพลงของคุณ</section><section id="library" hidden><section class="transport"><h2 id="now-playing">ยังไม่ได้เลือกเพลง</h2><canvas id="lyrics" width="1120" height="250" aria-label="เนื้อร้องคาราโอเกะ"></canvas><audio id="player" controls></audio><div class="controlbar"><button id="previous">เพลงก่อน</button><button id="stop">หยุด</button><button id="next">เพลงถัดไป</button><label>ความเร็ว <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label><label><input type="checkbox" id="repeat"> เล่นซ้ำ</label></div></section><section class="catalog"><section><h2>คลังเพลง <small id="result-count"></small></h2><input id="search" type="search" placeholder="ค้นหาชื่อเพลง / ศิลปิน / รหัสเพลง"><div id="songs"></div></section><section><h2>คิวเพลง <small id="queue-count"></small></h2><ol id="queue"></ol></section></section></section><footer>ไฟล์เสียงและฐานเพลงอยู่ใน Google Drive ส่วนตัวของบัญชีที่เข้าสู่ระบบเท่านั้น</footer></main><script src="config.js"></script><script src="https://accounts.google.com/gsi/client" async defer></script><script src="app.js" defer></script></body></html>
