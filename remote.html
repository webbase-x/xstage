<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061626">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>รีโมทมือถือ | X-Stage Karaoke Online</title>
  <link rel="icon" href="assets/xstage-logo.jpg" type="image/jpeg">
  <style>
    :root{font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,system-ui,sans-serif;color:#eaf7ff;background:#061321;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -20%,#15536a,#071928 63%);padding:14px max(12px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom))}
    main{max-width:650px;margin:0 auto}header{display:flex;align-items:center;gap:12px;padding:7px 2px 15px}header img{width:48px;height:48px;border-radius:11px;object-fit:cover}header strong{font-size:1.15rem;display:block}header small{color:#8cbdca;font-size:.72rem;display:block;margin-top:2px}
    #remote-status{margin:0 0 14px;padding:12px 14px;background:#0e2d42;border:1px solid #275a72;border-radius:11px;color:#92f4d6;font-size:.87rem;line-height:1.5}
    #remote-controls[hidden]{display:none!important}
    .current{padding:18px 16px;border:1px solid #316d86;border-radius:16px;background:#102b40;min-width:0}.current small{display:block;color:#7ef0d0;letter-spacing:.12em;font-size:.68rem}.current strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px;font-size:1.22rem}.current span{color:#9fbed0;font-size:.85rem;display:block;margin-top:5px}
    .transport{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:15px 0}.transport button,.remote-song-actions button{touch-action:manipulation;cursor:pointer;background:#143e55;border:1px solid #3b7a97;border-radius:13px;color:#fff;font-size:1.65rem;min-height:61px}.transport #remote-play{background:#29bfb7;color:#052335;border-color:#6efbdf}
    button:active{filter:brightness(1.3)}button:focus-visible,input:focus-visible{outline:2px solid #5ef2d5;outline-offset:3px}
    .volume{display:flex;align-items:center;gap:13px;padding:12px 3px 20px;color:#aacbda;font-size:.8rem}.volume input{flex:1;accent-color:#3de2bd;min-width:0}
    .search-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.search-title h2{font-size:1rem;margin:2px 0 12px}.queue-count{color:#86dcf1;font-size:.78rem}
    #remote-search{width:100%;min-height:49px;background:#061a2b;color:white;border:1px solid #38758e;border-radius:12px;padding:11px 14px;font-size:1.05rem;outline:0}
    #remote-results{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding-bottom:30px}.remote-song{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;border:1px solid #294e66;background:#10283d;min-width:0}
    .remote-song-info{min-width:0;flex:1}.remote-song-info strong,.remote-song-info small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.remote-song-info strong{font-size:.85rem}.remote-song-info small{font-size:.73rem;color:#93b7c8;margin-top:4px}
    .remote-song-actions{display:flex;gap:6px}.remote-song-actions button{min-height:39px;min-width:40px;border-radius:8px;font-size:1.14rem}.remote-song-actions .remote-add-queue{background:#1a4d4e;color:#8af3da}
    .remote-empty{color:#95bbcb;text-align:center;font-size:.85rem}
    footer{color:#658ba2;font-size:.72rem;text-align:center;line-height:1.7;padding:12px}
  </style>
</head>
<body>
  <main>
    <header><img src="assets/xstage-logo.jpg" alt=""><div><strong>X-STAGE REMOTE</strong><small>รีโมทมือถือสำหรับ Karaoke Online</small></div></header>
    <p id="remote-status" role="status" aria-live="polite">กำลังเตรียมการเชื่อมต่อ…</p>
    <section id="remote-controls" hidden aria-label="ควบคุม X-Stage">
      <div class="current"><small>NOW PLAYING</small><strong id="remote-now">ยังไม่ได้เลือกเพลง</strong><span id="remote-artist">X-Stage Karaoke</span></div>
      <div class="transport">
        <button type="button" id="remote-prev" aria-label="เพลงก่อนหน้า">⏮</button>
        <button type="button" id="remote-play" aria-label="เล่นหรือพัก">▶</button>
        <button type="button" id="remote-stop" aria-label="หยุด">⏹</button>
        <button type="button" id="remote-next" aria-label="เพลงถัดไป">⏭</button>
      </div>
      <label class="volume" for="remote-volume"><span>🔊 เสียง</span><input id="remote-volume" type="range" min="0" max="100" value="80"></label>
      <div class="search-title"><h2>ค้นหาเพลง</h2><span class="queue-count">คิวเพลง <strong id="remote-queue">0</strong></span></div>
      <input id="remote-search" type="search" autocomplete="off" placeholder="รหัส / ชื่อเพลง / ศิลปิน" aria-label="ค้นหาเพลงบนจอหลัก">
      <div id="remote-results" aria-live="polite"></div>
    </section>
    <footer>มือถือเป็นเพียงรีโมทควบคุม จอหลักยังเป็นผู้เล่นและเข้าถึง Google Drive ส่วนตัวเท่านั้น</footer>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js" defer></script>
  <script src="remote.js?v=0955" defer></script>
</body>
</html>
