<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X-Stage Karaoke Online</title>
  <link rel="icon" href="assets/xstage-logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="masthead">
      <img class="logo" src="assets/xstage-logo.jpg" alt="" width="54" height="54">
      <div><strong>X-Stage Karaoke</strong><span class="eyebrow">ONLINE</span></div>
      <a class="privacy" href="privacy.html">นโยบายความเป็นส่วนตัว</a>
    </header>
    <div class="stage" role="img" aria-label="เวทีและโลโก้ X-Stage Karaoke จากรุ่น Windows"></div>
    <section class="panel access" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">GOOGLE DRIVE</p>
        <h1 id="page-title">คลังเพลงของคุณ</h1>
        <p>ค้นหาและเล่นเพลงที่ซิงก์จาก X-Stage Karaoke สำหรับ Windows</p>
      </div>
      <button id="login" type="button"><span aria-hidden="true">G</span> เข้าสู่ระบบ Google</button><button id="logout" type="button">ออกจากระบบ / เปลี่ยนบัญชี</button>
      <div id="account"></div>
      <p id="status" role="status">เข้าสู่ระบบเพื่อเปิดคลังเพลงใน Google Drive</p>
    </section>
    <section id="library" class="panel" hidden>
      <div class="transport">
        <h2 id="now-playing">ยังไม่ได้เลือกเพลง</h2><canvas id="lyrics" width="1120" height="250" aria-label="เนื้อร้องคาราโอเกะ"></canvas>
        <audio id="player" controls></audio>
        <div class="controls">
          <button id="previous" type="button">เพลงก่อนหน้า</button>
          <button id="stop" type="button">หยุด</button>
          <button id="next" type="button">เพลงถัดไป</button>
          <label>ความเร็ว <select id="speed">
            <option value="0.75">0.75×</option><option value="1" selected>1×</option>
            <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
          </select></label>
          <label><input id="repeat" type="checkbox"> เล่นซ้ำเพลงนี้</label>
        </div>
        <p id="play-status" role="status"></p>
      </div>
      <div class="workspace">
        <section aria-labelledby="catalog-title">
          <h2 id="catalog-title">คลังเพลง</h2>
          <label for="search">ค้นหาเพลง</label>
          <input id="search" type="search" placeholder="ชื่อเพลง / นักร้อง / รหัสเพลง">
          <div id="songs"></div>
        </section>
        <section aria-labelledby="queue-title">
          <h2 id="queue-title">คิวเพลง <span id="queue-count"></span></h2>
          <ol id="queue"></ol>
        </section>
      </div>
    </section>
    <footer><a href="privacy.html">นโยบายความเป็นส่วนตัว</a></footer>
  </main>
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js" defer></script>
</body>
</html>
