'use strict';let lines=[],time=0,offset=0;const canvas=document.querySelector('#lyric'),pen=canvas.getContext('2d'),brand=document.querySelector('#brand');

}

function paintBrandBars(id,levels,p,mirror){const c=document.querySelector(id),size=c&&fitBrandCanvas(c);if(!size)return;const x=c.getContext('2d'),{w,h}=size;x.clearRect(0,0,w,h);const gap=Math.max(2,w*.012),bw=Math.max(2,(w-gap*(levels.length-1))/levels.length);levels.forEach((_,i)=>{const level=Math.max(.025,levels[mirror?levels.length-1-i:i]||0),bh=Math.max(2,level*h*.96),px=i*(bw+gap),py=h-bh,g=x.createLinearGradient(0,py,0,h);g.addColorStop(0,p.top);g.addColorStop(.48,p.mid);g.addColorStop(1,p.bottom);x.globalAlpha=.28+.72*level;x.fillStyle=g;x.shadowBlur=level>.28?10:4;x.shadowColor=p.glow;x.fillRect(px,py,bw,bh);});x.globalAlpha=1;x.shadowBlur=0;}

window.addEventListener('message',e=>{

   const v=String(e.data.value||'photo'),stage=document.querySelector('.stage');
   const theme=String(e.data.brandTheme||'premium-neon');

   if(v==='neon'){

   }else if(v==='deep-blue'){

     stage.style.backgroundImage="radial-gradient(circle at 50% 38%,rgba(28,86,160,.28),transparent 34%),linear-gradient(180deg,#0b2b5d 0%,#061d43 42%,#03142f 72%,#020b1d 100%)";
   }else{
     stage.style.backgroundColor='#020916';
     stage.style.backgroundImage="linear-gradient(180deg,#02081862 0%,#06102c00 35%,#03081d12 65%,#02081970 100%),url('assets/xstage-background.jpg')";
   }
   stage.style.backgroundSize='cover';stage.style.backgroundPosition='center center';
   return;
 }

 if(e.data?.type==='xstage-eq-meter'){applyEqMeter(e.data);return;}
 if(e.data?.type!=='xstage-stage')return;lines=Array.isArray(e.data.lines)?e.data.lines:[];time=Number(e.data.time)||0;offset=Number(e.data.offset)||0;document.querySelector('#title').textContent=e.data.title||'พร้อมร้องเพลง';document.querySelector('#artist').textContent=e.data.artist||'';const fmt=v=>{const n=Number(v);if(!Number.isFinite(n)||n<0)return'--:--';const t=Math.floor(n),h=Math.floor(t/3600),m=String(Math.floor(t/60)%60).padStart(2,'0'),sec=String(t%60).padStart(2,'0');return h?String(h)+':'+m+':'+sec:m+':'+sec};document.querySelector('#track-time').textContent=fmt(e.data.time)+' / '+fmt(e.data.duration);document.querySelector('#play-state').textContent=e.data.playing?'กำลังเล่น':'พัก';});
const EF=[20,25,31.5,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500,3150,4000,5000,6300,8000,10000,12500,16000,20000],seq=document.querySelector('#seq'),sb=document.querySelector('#seqbands'),sin=[];let seqBypassed=false;
function ec(f){return f<80?'#ff3b30':f<250?'#ff8a00':f<630?'#ffd400':f<1600?'#62e33c':f<4000?'#22d3a7':f<10000?'#18b7ff':'#755bff'}function elab(f){return f>=1000?(f/1000).toFixed(f%1000?2:0).replace(/0$/,'')+'k':String(f)}
EF.forEach((f,i)=>{const l=document.createElement('label');l.className='seqband';l.style.setProperty('--c',ec(f));const g=document.createElement('span');g.textContent='0';const led=document.createElement('i');const r=document.createElement('input');r.type='range';r.min='-12';r.max='12';r.step='1';r.value='0';r.oninput=()=>{document.querySelector('#seqpreset').value='custom';g.textContent=(+r.value>0?'+':'')+String(Math.round(+r.value));opener.postMessage({type:'xstage-eq-command',action:'gain',index:i,value:+r.value},location.origin)};r.ondblclick=()=>{r.value='0';r.dispatchEvent(new Event('input',{bubbles:true}))};r.addEventListener('wheel',e=>{e.preventDefault();const step=1,min=Number(r.min),max=Number(r.max),next=Math.max(min,Math.min(max,Number(r.value)+(e.deltaY<0?step:-step)));if(next===Number(r.value))return;r.value=String(next);r.dispatchEvent(new Event('input',{bubbles:true}))},{passive:false});const hz=document.createElement('span');hz.className='seqhz';hz.textContent=elab(f);l.append(g,led,r,hz);sb.append(l);sin.push({r,g,led})});
function applyEqState(d){seqBypassed=!!d.bypassed;seq.hidden=!d.open;seq.classList.toggle('min',!!d.minimized);seq.classList.toggle('max',!!d.expanded);document.querySelector('#seqpreset').value=d.preset||'flat';document.querySelector('#seqbypass').style.color=seqBypassed?'#ffcc67':'';(d.gains||[]).forEach((v,i)=>{if(!sin[i])return;sin[i].r.value=v;sin[i].g.textContent=(+v>0?'+':'')+String(Math.round(+v))})}
function applyEqMeter(d){(d.levels||[]).forEach((v,i)=>{if(!sin[i])return;sin[i].led.style.setProperty('--level-pct',(v*100).toFixed(1)+'%');sin[i].led.style.setProperty('--peak-pct',(v*100).toFixed(1)+'%');sin[i].led.style.setProperty('--glow',String(v));});document.querySelector('#seql').value=d.left||0;document.querySelector('#seqr').value=d.right||0;const c=document.querySelector('#seqcanvas'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#02070d';x.fillRect(0,0,c.width,c.height);(d.levels||[]).forEach((v,i)=>{x.fillStyle=ec(EF[i]);x.globalAlpha=.35+.65*v;x.fillRect(i*c.width/31,c.height-v*c.height,c.width/31-2,v*c.height)});x.globalAlpha=1}
document.querySelector('#eq').onclick=()=>{seq.hidden=false;opener.postMessage({type:'xstage-eq-command',action:'open'},location.origin)};
