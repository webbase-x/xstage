<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X-Stage Karaoke — จอร้องแยก</title><style>body{margin:0;color:white;background:#010814;font-family:Tahoma,sans-serif}.stage{position:fixed;inset:0;background:#010814 url('assets/xstage-background.jpg') center/cover no-repeat}.stage:before{content:'';position:absolute;inset:0;background:linear-gradient(#00132180,#000515b3)}canvas{position:absolute;inset:0;width:100%;height:100%}.info{position:absolute;bottom:3%;left:3%;right:3%;text-shadow:0 2px 9px black}h2{margin:0}small{color:#9dc8da}button{position:absolute;right:12px;top:12px;background:#0c2a40;color:white;border:1px solid #367b91;border-radius:8px;padding:10px;z-index:5}</style></head><body><main class="stage"><button id="full">เต็มจอ</button><canvas id="lyric"></canvas><div class="info"><h2 id="title">พร้อมร้องเพลง</h2><small id="artist">เปิดหน้าต่างหลักเพื่อเริ่มเล่น</small></div></main><script>
'use strict';let lines=[],time=0,offset=0;const canvas=document.querySelector('#lyric'),pen=canvas.getContext('2d');function draw(){const box=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(box.width*d),h=Math.round(box.height*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}pen.clearRect(0,0,w,h);const t=time+offset/1000;let idx=-1;for(let i=0;i<lines.length;i++){if(Number(lines[i].startTime)<=t)idx=i;else break;}if(idx>=0){const x=lines[idx],y=lines[idx+1];[x,y].forEach((line,j)=>{if(!line)return;const s=String(line.text||''),size=Math.min(82,w*.06,h*.13)*(j?.83:1);pen.font='900 '+Math.round(size)+'px Tahoma,sans-serif';pen.textAlign='center';pen.textBaseline='middle';const py=h*(j?.73:.55);pen.lineWidth=6;pen.strokeStyle='#010814';pen.strokeText(s,w/2,py,w*.95);pen.fillStyle=j?'#b8d4df':'#fff';pen.fillText(s,w/2,py,w*.95);if(!j){const p=Math.max(0,Math.min(1,(t-(Number(line.startTime)||0))/Math.max(.01,Number(line.endTime)-Number(line.startTime))));pen.save();const m=pen.measureText(s).width;pen.beginPath();pen.rect(w/2-m/2,py-size,m*p,size*2);pen.clip();pen.fillStyle='#ffe081';pen.fillText(s,w/2,py,w*.95);pen.restore();}});}requestAnimationFrame(draw);}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==opener||e.data?.type!=='xstage-stage')return;lines=Array.isArray(e.data.lines)?e.data.lines:[];time=Number(e.data.time)||0;offset=Number(e.data.offset)||0;document.querySelector('#title').textContent=e.data.title||'พร้อมร้องเพลง';document.querySelector('#artist').textContent=e.data.artist||'';});
document.querySelector('#full').onclick=()=>{const el=document.querySelector('.stage');document.fullscreenElement?document.exitFullscreen():el.requestFullscreen().catch(()=>{});};requestAnimationFrame(draw);
</script></body></html>
