<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X-Stage Karaoke — จอร้องแยก</title><style>body{margin:0;color:white;background:#010814;font-family:Tahoma,sans-serif}.stage{position:fixed;inset:0;background:#010814 url('assets/xstage-background.jpg') center/cover no-repeat}.stage:before{content:'';position:absolute;inset:0;background:linear-gradient(#00132180,#000515b3)}.metrics{position:absolute;top:clamp(9px,1.5vw,20px);right:clamp(78px,9vw,112px);z-index:6;display:flex;gap:clamp(5px,1vw,12px);align-items:center;padding:clamp(5px,.7vw,10px);background:#03121dd6;border:1px solid #52758a88;border-radius:9px;text-shadow:0 2px 5px #000;font-size:clamp(11px,1.5vw,19px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}@media(max-width:480px){.metrics{top:7px;right:76px;flex-direction:column;align-items:flex-end;gap:1px;font-size:11px}}canvas{position:absolute;inset:0;width:100%;height:100%}.info{position:absolute;bottom:3%;left:3%;right:3%;text-shadow:0 2px 9px black}h2{margin:0}small{color:#9dc8da}button{position:absolute;right:12px;top:12px;background:#0c2a40;color:white;border:1px solid #367b91;border-radius:8px;padding:10px;z-index:5}#eq{right:86px}.seq{position:fixed;z-index:20;left:3vw;top:9vh;width:min(1080px,92vw);height:min(620px,76vh);min-width:680px;min-height:390px;display:grid;grid-template-rows:auto auto minmax(80px,.7fr) minmax(200px,1.5fr) auto;color:#dff7ff;background:linear-gradient(#111a22fa,#05090dfa);border:1px solid #40576b;border-radius:14px;box-shadow:0 20px 60px #000c;overflow:hidden;resize:both}.seq[hidden]{display:none}.seqhead{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#17242d;border-bottom:1px solid #365166;cursor:move}.seqbrand{display:flex;align-items:center;gap:8px;font-weight:900}.seqbrand img{width:27px;height:27px;border-radius:6px}.seqactions{display:flex;gap:4px}.seqactions button,.seqtoolbar button{position:static;padding:5px 8px;min-height:28px}.seqtoolbar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#081117;border-bottom:1px solid #203442;font-size:12px}.seqtoolbar select{background:#111f29;color:#fff;border:1px solid #3a5f75;border-radius:5px;padding:4px 6px}.seqrta{display:grid;grid-template-columns:1fr 60px;gap:7px;padding:6px 9px;background:#03070a}.seqrta canvas{position:static;width:100%;height:100%;min-height:70px;border:1px solid #153a4a;border-radius:4px}.seqmeters{display:flex;gap:5px}.seqmeters div{display:flex;flex-direction:column;align-items:center;font-size:10px}.seqmeters meter{width:13px;height:100%;writing-mode:vertical-lr;direction:rtl}.seqbands{display:grid;grid-template-columns:repeat(31,minmax(18px,1fr));gap:2px;padding:6px 9px;overflow:hidden;background:#070b0e}.seqband{display:grid;grid-template-rows:16px 1fr minmax(145px,1fr) 17px;align-items:center;justify-items:center;font-size:9px;color:#9db3be}.seqband i{width:5px;height:100%;min-height:28px;border-radius:5px;background:#111;position:relative;overflow:hidden}.seqband i:after{content:'';position:absolute;left:0;right:0;bottom:0;height:calc(var(--level,0)*100%);background:var(--c);box-shadow:0 0 8px var(--c)}.seqband input{appearance:none;-webkit-appearance:none;width:145px;height:18px;transform:rotate(-90deg);background:transparent}.seqband input::-webkit-slider-runnable-track{height:5px;background:#44515a;border-radius:4px}.seqband input::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:13px;height:21px;margin-top:-8px;background:#dce8ed;border:1px solid white;border-radius:3px;box-shadow:0 0 6px var(--c)}.seqhz{color:var(--c);font-weight:900;transform:rotate(-42deg)}.seqfoot{position:relative;display:flex;justify-content:space-between;padding:4px 24px 4px 9px;background:#081014;color:#7895a3;font-size:10px}.seqfoot:after{content:'◢';position:absolute;right:5px;bottom:1px;color:#55dfff;font-size:15px}.seq.min{width:420px!important;height:auto!important;min-width:280px;min-height:0;resize:none}.seq.min>:not(.seqhead){display:none!important}.seq.max{inset:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 16px)!important;min-width:0;min-height:0;resize:none}@media(max-width:760px){.seq{min-width:0;width:96vw;left:2vw}.seqbands{overflow-x:auto;grid-template-columns:repeat(31,25px)}}</style><style>
.seq{width:min(1040px,94vw);height:min(570px,76vh);min-width:760px;min-height:455px;grid-template-rows:42px 40px 112px minmax(235px,1fr) 28px}
.seqhead{padding:6px 8px 6px 11px}.seqtoolbar{padding:5px 10px}.seqrta{grid-template-columns:1fr 58px;padding:6px 9px}
.seqbands{gap:3px;padding:6px 9px 4px}.seqband{grid-template-rows:16px 42px minmax(150px,1fr) 19px;gap:2px}
.seqband i{width:8px;min-height:38px;background:repeating-linear-gradient(to top,#0b1114 0 3px,#020405 3px 5px);border:1px solid #18272d}
.seqband i:after{background:repeating-linear-gradient(to top,var(--c) 0 3px,transparent 3px 5px);box-shadow:0 0 calc(3px + var(--level,0)*9px) var(--c);transition:height .045s linear}
.seqband i:before{content:'';position:absolute;left:-2px;right:-2px;height:2px;bottom:calc(var(--peak,0)*100%);background:#fff;box-shadow:0 0 5px var(--c);opacity:calc(.2 + var(--peak,0)*.8)}
.seqband input{width:142px}.seqhz{font-size:8px;transform:rotate(-38deg)}
@media(max-width:820px){.seq{width:97vw;height:74vh;left:1.5vw;min-width:0;min-height:390px}.seqbands{grid-template-columns:repeat(31,26px)}.seqband input{width:128px}}
</style></head><body><main class="stage"><button id="full">เต็มจอ</button><button id="eq">EQ</button><section id="seq" class="seq" hidden><header class="seqhead"><div class="seqbrand"><img src="assets/xstage-app-icon-192.png" alt=""><strong>EQ X-Stage Karaoke</strong></div><div class="seqactions"><button id="seqbypass">BYPASS</button><button id="seqmin">−</button><button id="seqmax">⤢</button><button id="seqclose">✕</button></div></header><div class="seqtoolbar"><label>Preset <select id="seqpreset"><option value="auto">AUTO</option><option value="flat">Flat</option><option value="pop">Pop</option><option value="rock">Rock</option><option value="jazz">Jazz</option><option value="vocal">Vocal</option><option value="edm">Dance / EDM</option><option value="acoustic">Acoustic</option><option value="classical">Classical</option></select></label><span>31 BAND · 1/3 OCTAVE</span></div><div class="seqrta"><canvas id="seqcanvas" width="1000" height="130"></canvas><div class="seqmeters"><div><span>L</span><meter id="seql" min="0" max="1"></meter></div><div><span>R</span><meter id="seqr" min="0" max="1"></meter></div></div></div><div id="seqbands" class="seqbands"></div><footer class="seqfoot"><span>±12 dB</span><span id="seqstyle">REMOTE EQ</span><span>RTA · L/R PEAK</span></footer></section><canvas id="lyric"></canvas><div class="metrics" aria-label="นาฬิกา"><time id="clock">--:--:--</time></div><div class="info"><h2 id="title">พร้อมร้องเพลง</h2><small id="artist">เปิดหน้าต่างหลักเพื่อเริ่มเล่น</small></div></main><script>
'use strict';let lines=[],time=0,offset=0;const canvas=document.querySelector('#lyric'),pen=canvas.getContext('2d');function draw(){const box=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(box.width*d),h=Math.round(box.height*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}pen.clearRect(0,0,w,h);const t=time+offset/1000;let idx=-1;for(let i=0;i<lines.length;i++){if(Number(lines[i].startTime)<=t)idx=i;else break;}if(idx>=0){const x=lines[idx],y=lines[idx+1];[x,y].forEach((line,j)=>{if(!line)return;const s=String(line.text||''),size=Math.min(88,w*.065,h*.14)*(j?.9:1);pen.font='900 '+Math.round(size)+'px Tahoma,sans-serif';pen.textAlign='center';pen.textBaseline='middle';const py=h*(j?.85:.67);pen.lineWidth=6;pen.strokeStyle='#010814';pen.strokeText(s,w/2,py,w*.95);pen.fillStyle=j?'#b8d4df':'#fff';pen.fillText(s,w/2,py,w*.95);if(!j){const p=Math.max(0,Math.min(1,(t-(Number(line.startTime)||0))/Math.max(.01,Number(line.endTime)-Number(line.startTime))));pen.save();const m=pen.measureText(s).width;pen.beginPath();pen.rect(w/2-m/2,py-size,m*p,size*2);pen.clip();pen.fillStyle='#ffe081';pen.fillText(s,w/2,py,w*.95);pen.restore();}});}requestAnimationFrame(draw);}
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==opener)return;
 if(e.data?.type==='xstage-background'){
   const v=String(e.data.value||'photo'),stage=document.querySelector('.stage');
   if(v==='neon'){
     stage.style.backgroundColor='#020817';
     stage.style.backgroundImage="linear-gradient(180deg,#0104123a,#07102e16 46%,#03071a56),url('assets/xstage-neon-stage.svg')";
   }else if(v==='deep-blue'){
     stage.style.backgroundColor='#031633';
     stage.style.backgroundImage="radial-gradient(circle at 50% 38%,rgba(28,86,160,.28),transparent 34%),linear-gradient(180deg,#0b2b5d 0%,#061d43 42%,#03142f 72%,#020b1d 100%)";
   }else{
     stage.style.backgroundColor='#020916';
     stage.style.backgroundImage="linear-gradient(180deg,#02081862 0%,#06102c00 35%,#03081d12 65%,#02081970 100%),url('assets/xstage-background.jpg')";
   }
   stage.style.backgroundSize='cover';stage.style.backgroundPosition='center center';
   return;
 }
 if(e.data?.type==='xstage-eq-state'){applyEqState(e.data);return;}
 if(e.data?.type==='xstage-eq-meter'){applyEqMeter(e.data);return;}
 if(e.data?.type!=='xstage-stage')return;lines=Array.isArray(e.data.lines)?e.data.lines:[];time=Number(e.data.time)||0;offset=Number(e.data.offset)||0;document.querySelector('#title').textContent=e.data.title||'พร้อมร้องเพลง';document.querySelector('#artist').textContent=e.data.artist||'';});
const EF=[20,25,31.5,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500,3150,4000,5000,6300,8000,10000,12500,16000,20000],seq=document.querySelector('#seq'),sb=document.querySelector('#seqbands'),sin=[];let seqBypassed=false;
function ec(f){return f<80?'#ff3b30':f<250?'#ff8a00':f<630?'#ffd400':f<1600?'#62e33c':f<4000?'#22d3a7':f<10000?'#18b7ff':'#755bff'}function elab(f){return f>=1000?(f/1000).toFixed(f%1000?2:0).replace(/0$/,'')+'k':String(f)}
EF.forEach((f,i)=>{const l=document.createElement('label');l.className='seqband';l.style.setProperty('--c',ec(f));const g=document.createElement('span');g.textContent='0.0';const led=document.createElement('i');const r=document.createElement('input');r.type='range';r.min='-12';r.max='12';r.step='.5';r.value='0';r.oninput=()=>{g.textContent=(+r.value>0?'+':'')+(+r.value).toFixed(1);opener.postMessage({type:'xstage-eq-command',action:'gain',index:i,value:+r.value},location.origin)};const hz=document.createElement('span');hz.className='seqhz';hz.textContent=elab(f);l.append(g,led,r,hz);sb.append(l);sin.push({r,g,led})});
function applyEqState(d){seqBypassed=!!d.bypassed;seq.hidden=!d.open;seq.classList.toggle('min',!!d.minimized);seq.classList.toggle('max',!!d.expanded);document.querySelector('#seqpreset').value=d.preset==='custom'?'flat':d.preset||'flat';document.querySelector('#seqbypass').style.color=seqBypassed?'#ffcc67':'';(d.gains||[]).forEach((v,i)=>{if(!sin[i])return;sin[i].r.value=v;sin[i].g.textContent=(+v>0?'+':'')+(+v).toFixed(1)})}
function applyEqMeter(d){(d.levels||[]).forEach((v,i)=>{if(!sin[i])return;sin[i].led.style.setProperty('--level',String(v));sin[i].led.style.setProperty('--peak',String(v));});document.querySelector('#seql').value=d.left||0;document.querySelector('#seqr').value=d.right||0;const c=document.querySelector('#seqcanvas'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#02070d';x.fillRect(0,0,c.width,c.height);(d.levels||[]).forEach((v,i)=>{x.fillStyle=ec(EF[i]);x.globalAlpha=.35+.65*v;x.fillRect(i*c.width/31,c.height-v*c.height,c.width/31-2,v*c.height)});x.globalAlpha=1}
document.querySelector('#eq').onclick=()=>{seq.hidden=false;opener.postMessage({type:'xstage-eq-command',action:'open'},location.origin)};
document.querySelector('#seqclose').onclick=()=>{seq.hidden=true;opener.postMessage({type:'xstage-eq-command',action:'close'},location.origin)};
document.querySelector('#seqmin').onclick=()=>seq.classList.toggle('min');document.querySelector('#seqmax').onclick=()=>seq.classList.toggle('max');
document.querySelector('#seqbypass').onclick=()=>opener.postMessage({type:'xstage-eq-command',action:'bypass',value:!seqBypassed},location.origin);
document.querySelector('#seqpreset').onchange=e=>opener.postMessage({type:'xstage-eq-command',action:'preset',value:e.target.value},location.origin);
(()=>{const h=seq.querySelector('.seqhead');let d=null;h.onpointerdown=e=>{if(e.target.closest('button,select'))return;const r=seq.getBoundingClientRect();d={x:e.clientX-r.left,y:e.clientY-r.top};h.setPointerCapture(e.pointerId)};h.onpointermove=e=>{if(!d||seq.classList.contains('max'))return;seq.style.left=Math.max(0,Math.min(innerWidth-seq.offsetWidth,e.clientX-d.x))+'px';seq.style.top=Math.max(0,Math.min(innerHeight-seq.offsetHeight,e.clientY-d.y))+'px'};h.onpointerup=()=>d=null})();
function updateMetrics(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}updateMetrics();setInterval(updateMetrics,250);
document.querySelector('#full').onclick=()=>{const el=document.querySelector('.stage');document.fullscreenElement?document.exitFullscreen():el.requestFullscreen().catch(()=>{});};requestAnimationFrame(draw);
</script></body></html>
